<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sessão · Sign in</title>
<link rel="icon" href="assets/naval-simbolo.png">

<style>
body{margin:0;background:#070B1F}
a{color:#7CC6EE}a:hover{color:#B5DEF4}
input:focus,select:focus{outline:2px solid #2397D4;outline-offset:1px}







/*RSP*/
.side-c details>summary::-webkit-details-marker{display:none}.side-c details>summary:hover{background:rgba(255,255,255,0.06)}.side-c details[open]>summary .chev{transform:rotate(90deg)}.side-c details[open]>summary{color:#FFFFFF;font-weight:500}.side-c a:hover{background:rgba(255,255,255,0.06)}.side-m::-webkit-scrollbar{display:none}
@media (max-width:760px){.side-c{display:none !important}.side-m{display:flex !important}}
@media (max-width:1100px){.g6,.g5{grid-template-columns:repeat(3,minmax(0,1fr)) !important}}@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr)) !important}}@media (max-width:620px){.g6,.g5{grid-template-columns:repeat(2,minmax(0,1fr)) !important}.g3{grid-template-columns:1fr !important}}
@media (max-width:1180px){.dock .dock-l{display:none !important}.dock .dock-i{min-width:44px !important;height:44px !important;padding:0 4px !important}}
@media (max-width:760px){
.dock{flex-wrap:nowrap !important;overflow-x:auto !important;justify-content:flex-start !important;align-self:stretch !important;max-width:100% !important;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dock::-webkit-scrollbar{display:none}.dock>*{flex:0 0 auto}
main{padding:14px 12px 28px !important;gap:12px !important}
main section[style*="background"]{padding:14px !important;border-radius:20px !important}
.g3>*,.g4>*,.g5>*,.g6>*{padding:12px 14px !important;border-radius:18px !important;min-width:0 !important;overflow:hidden}
main [style*="justify-content: flex-end"]>span[style*="font-size: 11px; font-variant-numeric: tabular-nums; color: rgba(235,235,245,0.78)"]{display:none}
nav.side:not(.side-g){padding:12px !important;gap:10px !important}
nav.side:not(.side-g)>div:nth-child(2){flex-direction:row !important;flex-wrap:nowrap !important;overflow-x:auto !important;scrollbar-width:none;gap:6px !important}
nav.side:not(.side-g)>div:nth-child(2)::-webkit-scrollbar{display:none}
nav.side:not(.side-g)>div:nth-child(2)>*{flex:0 0 auto;white-space:nowrap}
nav.side:not(.side-g)>div:nth-child(2)>span{display:none}
main h1{font-size:25px !important;letter-spacing:-0.3px !important}
main select,main input,main textarea{max-width:100% !important;min-width:0 !important}
main [style*="align-items: flex-end"][style*="gap: 10px"]{gap:4px !important}
main [style*="grid-template-columns: 172px"]{grid-template-columns:104px minmax(0,1fr) 44px !important}
main [style*="grid-template-columns: minmax(0, 2fr) 90px 130px 90px"]{grid-template-columns:minmax(0,1fr) 40px 100px 52px !important;gap:6px !important}
main [style*="grid-template-columns: minmax(0, 2fr) 90px 130px 90px"]>:nth-child(5){grid-column:1/-1;text-align:left !important;font-size:12px !important;color:rgba(235,235,245,0.6) !important}
main [style*="text-transform: uppercase"][style*="grid-template-columns: minmax(0, 2fr) 90px 130px 90px"]>:nth-child(5){display:none}
}
@media (max-width:420px){main [style*="font-size: 11px; color: rgba(235,235,245,0.6)"]{font-size:10px !important}}
@media (min-width:1700px){main{padding-left:40px !important;padding-right:40px !important}}
/*RSP-END*/
</style>
<script src="dc.js"></script>
</head>
<body>
<script type="text/x-dc-template" id="dc-tpl">

<div style="height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; position: relative; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #F5F5F7; -webkit-font-smoothing: antialiased; background: radial-gradient(900px 600px at 50% -20%, rgba(35,151,212,0.30), transparent 62%), radial-gradient(800px 560px at 50% 120%, rgba(39,55,119,0.75), transparent 60%), #070B1F">
<div role="group" aria-label="{{t.idioma}}" style="position: absolute; top: 20px; right: 20px; display: flex; gap: 2px; padding: 3px; border-radius: 99px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12)">
<button type="button" aria-pressed="{{ptOn}}" onClick="{{setPT}}" style="{{ptStyle}}">PT</button>
<button type="button" aria-pressed="{{enOn}}" onClick="{{setEN}}" style="{{enStyle}}">EN</button>
</div>
<div style="width: 100%; max-width: 400px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: 30px; backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); padding: 40px 32px 32px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; box-shadow: 0 0 0 1px rgba(35,151,212,0.15), 0 30px 80px rgba(0,0,0,0.45)">
<img src="assets/naval-logo.png" alt="Naval" style="height: 84px; width: auto">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.3px">{{t.titulo}}</h1>
<p style="margin: 0; font-size: 14px; color: rgba(235,235,245,0.6)">{{t.sub}}</p>
</div>
<a href="{{entrarHref}}" style="width: 100%; height: 50px; border-radius: 14px; background: #2397D4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 15px; text-decoration: none; box-shadow: 0 6px 20px rgba(35,151,212,0.35)">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>{{t.entrar}}</a>
<p style="margin: 0; font-size: 12px; color: rgba(235,235,245,0.6); line-height: 1.5">{{t.nota}}</p>
</div>
</div>
</script>
<div id="dc-app"></div>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
var l = 'pt';
try { var __nl = String((window.navigator.languages && window.navigator.languages[0]) || window.navigator.language || 'pt').toLowerCase(); l = __nl.indexOf('pt') === 0 ? 'pt' : 'en'; } catch (e) {}
try { l = window.localStorage.getItem('naval-lang') || l; } catch (e) {}
this.state = { lang: l };
}
setLang(l) {
try { window.localStorage.setItem('naval-lang', l); } catch (e) {}
this.setState({ lang: l });
}
renderVals() {
var self = this;
var en = this.state.lang === 'en';
var t = en ? {
titulo: 'Naval Group Portal', sub: 'Sign in with your company account', entrar: 'Sign in with Microsoft 365',
nota: 'Same account as Outlook and Teams. You only see what your role allows.', idioma: 'Language'
} : {
titulo: 'Portal do Grupo Naval', sub: 'Entre com a conta da empresa', entrar: 'Entrar com Microsoft 365',
nota: 'A mesma conta do Outlook e do Teams. Vê apenas o que a sua função permite.', idioma: 'Idioma'
};
var pill = 'height: 30px; min-width: 40px; padding: 0 10px; border-radius: 99px; border: none; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; ';
return {
entrarHref: en ? 'Inicio_en.dc.html' : 'Inicio.dc.html',
t: t,
ptOn: en ? 'false' : 'true', enOn: en ? 'true' : 'false',
ptStyle: pill + (en ? 'background: transparent; color: rgba(235,235,245,0.7)' : 'background: #2397D4; color: #FFFFFF'),
enStyle: pill + (en ? 'background: #2397D4; color: #FFFFFF' : 'background: transparent; color: rgba(235,235,245,0.7)'),
setPT: function () { self.setLang('pt'); },
setEN: function () { self.setLang('en'); }
};
}
}
DC.mount(Component);
</script>
</body>
</html>

<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: 5, empresa: 'all', filtro: 'todos', pedidos: {} };
}
renderVals() {
var self = this;
var f1 = function (v) { var p = v.toFixed(1).split('.'); return (p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '.' + p[1]).replace('.', ','); };
var sg = function (v) { return (v > 0 ? '+' : (v < 0 ? '−' : '')) + f1(Math.abs(v)); };
var dados = [
['1.01', 'Administração', 'sup', 210, 86], ['1.02', 'Financeiro', 'sup', 150, 79], ['1.03', 'Recursos Humanos', 'sup', 118, 81], ['1.04', 'Informática', 'sup', 120, 94],
['2.01', 'Comercial', 'op', 420, 88], ['2.02', 'Logística', 'op', 520, 91], ['2.03', 'Produção', 'op', 1380, 85],
['3.01', 'Canal 01 · Viana', 'can', 70, 84], ['3.02', 'Canal 02 · Talatona', 'can', 66, 92], ['3.03', 'Canal 03 · Kilamba', 'can', 62, 95], ['3.04', 'Canal 04 · Cacuaco', 'can', 48, 80], ['3.05', 'Canal 05 · Benfica', 'can', 46, 103],
['4.01', 'Obra Vistar · Talatona', 'proj', 900, 78]
];
var EMP = [
['OCEANO', 'P', 0.14], ['CAZENGO', 'P', 0.10], ['YAWABA', 'P', 0.08], ['INOVAGATE', 'P', 0.07], ['VISTAR', 'P', 0.08], ['PAKTEC', 'P', 0.05], ['EMBALTEC', 'P', 0.04],
['AGRO', 'P', 0.02], ['BIGAS', 'P', 0.01], ['EVERYTEL', 'P', 0.02], ['INDUCLEAN', 'P', 0.02], ['LIMPODOURO', 'P', 0.01], ['MAJITEC', 'P', 0.01], ['METAL', 'P', 0.03], ['MFUTILA', 'P', 0.01], ['ZOMBO', 'P', 0.01],
['Foodtec', 'S', 0.08], ['VeloTrans', 'S', 0.07], ['Naval Trading', 'S', 0.05], ['Everywhere Grãos', 'S', 0.04], ['Refitec', 'S', 0.03], ['Higitec', 'S', 0.03], ['Guarda Oceânica', 'S', 0.02]
];
var CANAL = { '3.01': 'CAZENGO', '3.04': 'CAZENGO', '3.02': 'INOVAGATE', '3.05': 'INOVAGATE', '3.03': 'YAWABA' };
var aplica = function (d, e) {
if (d[2] === 'can') return CANAL[d[0]] === e[0];
if (d[2] === 'proj') return e[0] === 'VISTAR';
if (d[0] === '2.03') return ['OCEANO', 'PAKTEC', 'EMBALTEC', 'METAL', 'AGRO', 'Foodtec', 'Everywhere Grãos', 'Refitec', 'Higitec', 'INDUCLEAN'].indexOf(e[0]) >= 0;
return true;
};
var quota = function (d, e) { var tot = 0; EMP.forEach(function (x) { if (aplica(d, x)) tot += x[2]; }); return aplica(d, e) ? e[2] / tot : 0; };
var emp = this.state.empresa || 'all';
var empObj = null;
EMP.forEach(function (e) { if (e[0] === emp) empObj = e; });
var nomesArea = { sup: 'Suporte', op: 'Operacional', can: 'Canais de Venda Direta', proj: 'Projectos' };
var rows = [];
dados.forEach(function (d, i) {
var q = empObj ? quota(d, empObj) : 1;
if (!q) return;
var anual = d[3] * q;
var orc = anual * 10 / 12;
var real = anual * d[4] / 100;
var dv = real - orc;
rows.push({ i: i, cod: d[0], nome: d[1], area: d[2], anual: anual, orc: orc, real: real, dv: dv, pct: orc ? dv / orc * 100 : 0 });
});
var estado = function (p) { return p > 8 ? 'acima' : (p > 3 ? 'atencao' : 'dentro'); };
var EST = { acima: ['Acima', 'background: rgba(255,69,58,0.16); color: #FF6961'], atencao: ['Atenção', 'background: rgba(201,130,42,0.16); color: #E0A458'], dentro: ['Dentro', 'background: rgba(48,209,88,0.12); color: #30D158'] };
var maxAbs = 0;
rows.forEach(function (r) { if (Math.abs(r.pct) > maxAbs) maxAbs = Math.abs(r.pct); });
maxAbs = Math.max(maxAbs, 10);
var sel = this.state.sel;
var temSel = false;
rows.forEach(function (r) { if (r.i === sel) temSel = true; });
if (!temSel && rows.length) sel = rows[0].i;
var filtro = this.state.filtro;
var lista = rows.slice().sort(function (a, b) { return b.pct - a.pct; }).filter(function (r) { return filtro === 'todos' || (filtro === 'desvio' ? estado(r.pct) !== 'dentro' : r.dv < 0); });
var linhas = lista.map(function (r) {
var on = r.i === sel;
var e = estado(r.pct);
var w = Math.min(50, Math.abs(r.pct) / maxAbs * 50);
var cor = r.dv < 0 ? '#30D158' : (e === 'acima' ? '#FF453A' : (e === 'atencao' ? '#C9822A' : '#2397D4'));
return {

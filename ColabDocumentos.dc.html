<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07)">
<span style="width: 40px; height: 40px; flex: 0 0 auto; border-radius: 10px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #FF6961">PDF</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 220px; min-width: 0"><span style="font-size: 14px; font-weight: 500">{{d.nome}}</span><span style="font-size: 12px; color: rgba(235,235,245,0.55)">{{d.info}}</span></span>
<span style="{{d.estStyle}}">{{d.est}}</span>
<button type="button" onClick="{{d.acao}}" style="{{d.btnStyle}}">{{d.btn}}</button>
</div>
</sc-for>
<sc-if value="{{vazio}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; color: rgba(235,235,245,0.6)">Ainda não há documentos nesta pasta.</span>
</sc-if>
</section>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px">
<section aria-label="Pedir declaração" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Pedir uma declaração</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tiposDecl}}" as="t" hint-placeholder-count="4">
<button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<span style="{{declMsgStyle}}">{{declMsg}}</span>
<button type="button" onClick="{{pedirDecl}}" style="{{declBtnStyle}}">{{declBtn}}</button>
</section>
<section aria-label="Carregar documento" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Entregar um documento</h2>
<span style="font-size: 13px; color: rgba(235,235,245,0.7); line-height: 1.5">Justificativo de falta, atestado médico, certificado de formação ou atualização de dados pessoais. Os Recursos Humanos validam em 2 dias úteis.</span>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<label style="position: relative; overflow: hidden; display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 10px; background: #2397D4; color: #FFFFFF; font-size: 13px; font-weight: 500; cursor: pointer">Escolher ficheiro<input type="file" accept="application/pdf,image/*" onChange="{{carregar}}" style="position: absolute; width: 1px; height: 1px; opacity: 0"></label>
<label style="position: relative; overflow: hidden; display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid #2397D4; color: #7CC6EE; font-size: 13px; font-weight: 500; cursor: pointer">Tirar fotografia<input type="file" accept="image/*" capture="environment" onChange="{{carregar}}" style="position: absolute; width: 1px; height: 1px; opacity: 0"></label>
</div>
<span style="{{upMsgStyle}}">{{upMsg}}</span>
</section>
</div>
</main>
</div>

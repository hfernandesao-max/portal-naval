</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: rgba(235,235,245,0.6)">Valor da V/ Factura (Kz)
<input type="number" value="{{e.ftValor}}" onInput="{{setFtValor}}" style="height: 40px; border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 0 12px; font-family: inherit; font-size: 14px; font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.05); color: #F5F5F7">

</div>
<span style="{{conf.style}}">{{conf.txt}}</span>
</div>
<sc-if value="{{e.porLancar}}" hint-placeholder-val="{{ true }}">

<span style="font-size: 13px; color: rgba(235,235,245,0.7); flex: 1 1 280px; line-height: 1.5">{{falta}}</span>
<button type="button" onClick="{{lancar}}" style="{{lancarStyle}}">{{lancarTxt}}</button>
</div>
</sc-if>
<sc-if value="{{e.lancado}}" hint-placeholder-val="{{ false }}">

</sc-for>
<span style="font-size: 12px; color: rgba(235,235,245,0.7); line-height: 1.5">{{res.nota}}</span>
</div>
</sc-if>
</section>
</div>

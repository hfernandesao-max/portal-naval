<style>

<body>
<script type="text/x-dc-template" id="dc-tpl">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #F5F5F7; -webkit-font-smoothing: antialiased; background: radial-gradient(900px 600px at 8% -12%, rgba(35,151,212,0.28), transparent 62%), radial-gradient(800px 560px at 96% -6%, rgba(39,55,119,0.75), transparent 60%), #070B1F">
<nav class="side" aria-label="Menu do cliente" style="flex: 1 1 240px; max-width: 100%; background: rgba(255,255,255,0.04); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border-right: 1px solid rgba(255,255,255,0.08); padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<img src="assets/naval-simbolo.png" alt="Naval" style="height: 36px; width: auto">
<div style="display: flex; flex-direction: column">
<span style="font-weight: 600; font-size: 17px; letter-spacing: 0.5px">OCEANO</span>
<span style="font-size: 11px; color: rgba(235,235,245,0.6); letter-spacing: 1.2px; text-transform: uppercase">Portal do cliente</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="OceanoAgendar.dc.html" style="display: block; padding: 11px 12px; border-radius: 12px; font-size: 14px; text-decoration: none; color: rgba(235,235,245,0.78)">Agendar revisão</a>
<a href="OceanoMarcacoes.dc.html" style="display: block; padding: 11px 12px; border-radius: 12px; font-size: 14px; text-decoration: none; background: rgba(35,151,212,0.16); color: #FFFFFF; box-shadow: inset 2px 0 0 #7CC6EE; font-weight: 500">As minhas marcações</a>
<a href="#equipamentos" style="display: block; padding: 11px 12px; border-radius: 12px; font-size: 14px; text-decoration: none; color: rgba(235,235,245,0.78)">Os meus equipamentos</a>
<a href="#historico" style="display: block; padding: 11px 12px; border-radius: 12px; font-size: 14px; text-decoration: none; color: rgba(235,235,245,0.78)">Histórico e facturas</a>
</div>
<div style="margin-top: auto; padding: 14px; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 500">[CLIENTE A], Lda</span>
<span style="font-size: 12px; color: rgba(235,235,245,0.6)">Cliente n.º C000123</span>
<span style="font-size: 12px; color: rgba(235,235,245,0.6)">Apoio: [TELEFONE OCEANO]</span>
</div>
</nav>
<main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #7CC6EE; letter-spacing: 1px">OCEANO · ASSISTÊNCIA TÉCNICA</span>
<span class="fase2" title="Fase 2" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; padding: 4px 10px; border-radius: 99px; background: rgba(201,130,42,0.16); color: #E0A458; border: 1px solid rgba(201,130,42,0.35)">Fase 2 · protótipo do circuito, ainda não grava no ERP</span>
<h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.5px">As minhas marcações</h1>
<span style="font-size: 13px; color: rgba(235,235,245,0.6)">Acompanhe as revisões marcadas e o estado de cada trabalho · <span style="color: #C9822A">dados de exemplo</span></span>
</div>
<a href="OceanoAgendar.dc.html" style="height: 44px; padding: 0 20px; border-radius: 12px; background: #2397D4; color: #FFFFFF; display: flex; align-items: center; font-weight: 600; font-size: 14px; text-decoration: none">Agendar nova revisão</a>
</header>
<section style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Próximas e em curso</h2>
<sc-for list="{{marcacoes}}" as="m" hint-placeholder-count="2">
<div style="border: 1px solid rgba(255,255,255,0.10); border-radius: 18px; padding: 16px; background: rgba(255,255,255,0.03); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 16px; font-weight: 600">{{m.eq}}</span>
<span style="font-size: 13px; color: rgba(235,235,245,0.6)">{{m.serv}} · {{m.ref}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px">
<span style="font-size: 15px; font-variant-numeric: tabular-nums">{{m.quando}}</span>
<span style="font-size: 13px; color: rgba(235,235,245,0.6)">{{m.onde}}</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{m.passos}}" as="s" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 6px"><div style="{{s.barra}}"></div><span style="{{s.txt}}">{{s.label}}</span></div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
<span style="font-size: 13px; color: rgba(235,235,245,0.78)">{{m.nota}}</span>
<div style="display: flex; gap: 8px">
<sc-if value="{{m.alteravel}}" hint-placeholder-val="{{ true }}">
<a href="OceanoAgendar.dc.html" style="height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); color: rgba(235,235,245,0.85); display: flex; align-items: center; font-size: 13px; text-decoration: none">Reagendar</a>
<button type="button" style="height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,69,58,0.4); background: transparent; color: #FF6961; font-family: inherit; font-size: 13px">Cancelar</button>
</sc-if>
</div>
</div>
</div>
</sc-for>
</section>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<section id="equipamentos" style="flex: 1 1 380px; min-width: 0; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Os meus equipamentos</h2>
<sc-for list="{{equip}}" as="e" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08)">
<div style="display: flex; justify-content: space-between; gap: 10px"><span style="font-size: 14px; font-weight: 500">{{e.nome}}</span><span style="{{e.alertStyle}}">{{e.alerta}}</span></div>
<div style="height: 8px; border-radius: 99px; background: rgba(255,255,255,0.10); overflow: hidden"><div style="{{e.bar}}"></div></div>
<span style="font-size: 12px; color: rgba(235,235,245,0.6)">{{e.prox}}</span>
</div>
</sc-for>
</section>
<section id="historico" style="flex: 1 1 380px; min-width: 0; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); padding: 20px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Histórico e facturas</h2>
<sc-for list="{{hist}}" as="h" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08)">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">{{h.desc}}</span><span style="font-size: 12px; color: rgba(235,235,245,0.6)">{{h.data}} · {{h.doc}}</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="font-size: 14px; font-variant-numeric: tabular-nums">{{h.valor}}</span><button type="button" style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: transparent; color: rgba(235,235,245,0.85); font-family: inherit; font-size: 12px">PDF</button></div>
</div>
</sc-for>
</section>
</div>
</main>
</div>
</script>
<div id="dc-app"></div>
<script>
class Component extends DCLogic {
renderVals() {
var nomes = ['Marcada', 'Confirmada', 'Na oficina', 'Pronta', 'Entregue'];
var mk = function (n) {
return nomes.map(function (l, i) {
var feito = i <= n, act = i === n;
return { label: l, barra: 'height: 6px; border-radius: 99px; background: ' + (act ? '#7CC6EE' : (feito ? '#2397D4' : 'rgba(255,255,255,0.10)')), txt: 'font-size: 12px; color: ' + (act ? '#7CC6EE; font-weight: 500' : (feito ? 'rgba(235,235,245,0.78)' : 'rgba(235,235,245,0.4)')) };
});
};
var marcacoes = [
{ eq: 'Motor marítimo 350 cv', serv: 'Revisão programada', ref: 'REV-2026-1184', quando: '18 Nov 2026 · 09:30', onde: 'Oficina Oceano · Viana', passos: mk(1), nota: 'Confirmada pela Oceano. Um técnico contacta-o na véspera.', alteravel: true },
{ eq: 'Gerador 250 kVA', serv: 'Diagnóstico de avaria', ref: 'REV-2026-1121', quando: '08 Out 2026 · 14:00', onde: 'No local do cliente', passos: mk(2), nota: 'Orçamento enviado a 09/10 · aguarda a sua aprovação.', alteravel: false }
];
var pl = 'flex: none; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; ';
var equip = [
['Gerador 250 kVA', 96, 'Revisão das 5 000 h em breve', 'w', 'Faltam cerca de 180 horas para a próxima revisão'],
['Motor marítimo 350 cv', 100, 'Revisão anual em atraso', 'c', 'Revisão anual vencida a 30/09/2026 · já marcada para 18/11'],
['Compressor industrial', 46, 'Em dia', 'n', 'Próxima revisão às 5 000 horas (faltam 2 700)']
].map(function (e) {
var cor = e[3] === 'c' ? '#FF453A' : (e[3] === 'w' ? '#C9822A' : '#2397D4');
var al = e[3] === 'c' ? 'background: rgba(255,69,58,0.16); color: #FF6961' : (e[3] === 'w' ? 'background: rgba(201,130,42,0.16); color: #E0A04A' : 'background: rgba(48,209,88,0.12); color: #30D158');
return { nome: e[0], alerta: e[2], alertStyle: pl + al, prox: e[4], bar: 'height: 100%; border-radius: 99px; background: ' + cor + '; width: ' + e[1] + '%' };
});
var hist = [
['Revisão programada · Gerador 250 kVA', '12/05/2026', 'FT 2026/0841', '485 000 Kz'],
['Substituição de bomba de água · Motor marítimo', '03/03/2026', 'FT 2026/0352', '1 120 000 Kz'],
['Revisão programada · Compressor industrial', '20/01/2026', 'FT 2026/0098', '312 500 Kz'],
['Revisão anual · Motor marítimo 350 cv', '28/09/2025', 'FT 2025/2210', '640 000 Kz']
].map(function (h) { return { desc: h[0], data: h[1], doc: h[2], valor: h[3] }; });
return { marcacoes: marcacoes, equip: equip, hist: hist };
}
}
DC.mount(Component);
</script>
</body>
</html>

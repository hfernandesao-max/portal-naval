<div id="dc-app"></div>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: 1, feitos: { 0: true }, resp: {}, erro: '' };
}
renderVals() {
var self = this;
var pessoas = [
['Myself', 'Self-assessment', 'self'],
['[MANAGER NAME]', 'My manager', 'chefia'],
['[DIRECT REPORT A]', 'Direct report', 'sub'],
['[DIRECT REPORT B]', 'Direct report', 'sub']
];
var sel = this.state.sel;
var tipo = pessoas[sel][2];
var comp = [
['Customer focus', 'Understands and responds to internal and external customers\' needs.'],
['Teamwork', 'Collaborates, shares information and supports colleagues.'],
['Communication', 'Expresses ideas clearly and listens to others.'],
['Accountability and rigour', 'Delivers on commitments, with quality and attention to detail.'],
['Initiative', 'Anticipates problems and proposes solutions without being asked.'],
tipo === 'chefia' ? ['Leadership', 'Guides, supports and develops the team, and gives useful feedback.'] : ['Meeting deadlines', 'Delivers work within the agreed deadlines.']
];
var etiquetas = ['Poor', 'Needs work', 'Adequate', 'Good', 'Excellent'];
var respondidas = 0;
var perguntas = comp.map(function (c, i) {
var v = self.state.resp[i];
if (v) respondidas++;
return {
nome: c[0], desc: c[1],
opcoes: etiquetas.map(function (e, j) {
var on = v === j + 1;
return {
n: String(j + 1), label: e, checked: on ? 'true' : 'false',
pick: function () { var r = Object.assign({}, self.state.resp); r[i] = j + 1; self.setState({ resp: r, erro: '' }); },
style: 'min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; font-family: inherit; cursor: pointer; ' + (on ? 'border: 1px solid #7CC6EE; background: #2397D4; color: #FFFFFF' : 'border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: rgba(235,235,245,0.78)')
};
})
};
});
var pill = 'display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap; ';
var feito = 'background: rgba(48,209,88,0.12); color: #30D158', pend = 'background: rgba(201,130,42,0.14); color: #C9822A', cur = 'background: rgba(35,151,212,0.2); color: #7CC6EE';
var feitos = this.state.feitos;
var enviado = !!feitos[sel];
var tarefas = pessoas.map(function (p, i) {
var f = !!feitos[i];
var est = f ? 'Completed' : (i === sel ? 'In progress' : 'Pending');
return {
quem: p[0], papel: p[1], estado: est, estStyle: pill + (f ? feito : (i === sel ? cur : pend)), on: i === sel ? 'true' : 'false',
pick: function () { self.setState({ sel: i, resp: {}, erro: '' }); },
box: 'width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; font-family: inherit; cursor: pointer; ' + (i === sel ? 'background: rgba(35,151,212,0.14); border: 1px solid #2397D4' : 'background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12)')
};
});
var faltam = pessoas.filter(function (p, i) { return !feitos[i]; }).length;
var proximo = -1;
pessoas.forEach(function (p, i) { if (proximo < 0 && !feitos[i]) proximo = i; });
var titulos = { self: 'Self-assessment', chefia: 'Reviewing my manager', sub: 'Reviewing a direct report' };
var notas = { self: 'Your self-assessment is seen by you and your manager.', chefia: 'Anonymous: your manager only sees the team\'s average.', sub: 'Your direct report sees this review in the results meeting.' };
var __me = this;
var __pill = 'display: inline-flex; align-items: center; justify-content: center; text-decoration: none; height: 36px; width: 38px; border: none; border-radius: 10px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; ';
var __en = true;
return { dkPThref: 'ColabAvaliacao.dc.html', dkENhref: 'ColabAvaliacao_en.dc.html', dkPT: function () { try { window.localStorage.setItem('naval-lang', 'pt'); } catch (e) {} __me.forceUpdate(); }, dkEN: function () { try { window.localStorage.setItem('naval-lang', 'en'); } catch (e) {} __me.forceUpdate(); }, dkPTs: __pill + (__en ? 'background: transparent; color: rgba(235,235,245,0.7)' : 'background: #2397D4; color: #FFFFFF'), dkENs: __pill + (__en ? 'background: #2397D4; color: #FFFFFF' : 'background: transparent; color: rgba(235,235,245,0.7)'), dk: __en ? {home: 'Home', sales: 'Sales', cc: 'Accounts', stock: 'Inventory', exec: 'Executive', ccu: 'Cost centres', forn: 'Suppliers', frota: 'Fleet', colab: 'Human Resources', org: 'Organisation', phone: 'Mobile', out: 'Sign out'} : {home: 'Home', sales: 'Sales', cc: 'Accounts', stock: 'Inventory', exec: 'Executive', ccu: 'Cost centres', forn: 'Suppliers', frota: 'Fleet', colab: 'Human Resources', org: 'Organisation', phone: 'Mobile', out: 'Sign out'}, 
tarefas: tarefas, perguntas: perguntas,
enviado: enviado, aResponder: !enviado,
papelTit: titulos[tipo], quemTit: pessoas[sel][0], nota: notas[tipo],
msgOk: 'Thank you. The review of ' + pessoas[sel][0] + ' has been recorded.' + (faltam ? (faltam === 1 ? ' 1 review left to finish this cycle.' : ' ' + faltam + ' reviews left to finish this cycle.') : ' You have completed all reviews for this cycle.'),
haMais: faltam > 0, seguinteTxt: 'Review the next one',
seguinte: function () { if (proximo >= 0) self.setState({ sel: proximo, resp: {}, erro: '' }); },
progresso: respondidas + ' of ' + comp.length + ' answered',
barra: 'height: 100%; border-radius: 99px; background: #2397D4; width: ' + Math.round(respondidas / comp.length * 100) + '%',
erro: this.state.erro,
enviar: function () {
if (respondidas < comp.length) { self.setState({ erro: 'Answer every competency before submitting.' }); return; }
var fz = Object.assign({}, self.state.feitos); fz[sel] = true; self.setState({ feitos: fz, erro: '' });
}
};
}
}
DC.mount(Component);
</script>

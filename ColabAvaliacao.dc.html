<span style="font-size: 13px; color: rgba(235,235,245,0.6)">Cada colaborador faz a auto-avaliação, avalia a sua chefia e avalia os seus subordinados · as avaliações à chefia são anónimas · <span style="color: #C9822A">dados de exemplo</span></span>

<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left">
<span style="font-size: 14px; font-weight: 500; color: #F5F5F7">{{t.quem}}</span>
<span style="font-size: 12px; color: rgba(235,235,245,0.6)">{{t.papel}}</span>
</span>
<span style="{{t.estStyle}}">{{t.estado}}</span>
</button>
</sc-for>
</section>
<section style="flex: 3 1 480px; min-width: 0; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); padding: 22px; display: flex; flex-direction: column; gap: 18px">

<p style="margin: 0; font-size: 15px; color: rgba(235,235,245,0.78); line-height: 1.5">{{msgOk}}</p>
<sc-if value="{{haMais}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{seguinte}}" style="align-self: flex-start; margin-top: 6px; height: 44px; padding: 0 20px; border-radius: 12px; border: none; background: #2397D4; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer">{{seguinteTxt}}</button></sc-if>
</div>
</sc-if>
<sc-if value="{{aResponder}}" hint-placeholder-val="{{ true }}">

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: rgba(235,235,245,0.6); text-transform: uppercase; letter-spacing: 1px">{{papelTit}}</span>

</div>
<span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-variant-numeric: tabular-nums; font-size: 13px; color: rgba(235,235,245,0.78)">{{progresso}}</span>
</div>
<div style="height: 6px; background: rgba(255,255,255,0.10); border-radius: 99px; overflow: hidden"><div style="{{barra}}"></div></div>

<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 500">{{q.nome}}</span>
<span style="font-size: 13px; color: rgba(235,235,245,0.6)">{{q.desc}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{q.opcoes}}" as="o" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="{{o.style}}"><span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-variant-numeric: tabular-nums; font-size: 16px">{{o.n}}</span><span style="font-size: 11px">{{o.label}}</span></button>
</sc-for>
</div>
</div>
</sc-for>

<div id="dc-app"></div>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: 1, feitos: { 0: true }, resp: {}, erro: '' };
}
renderVals() {
var self = this;
var pessoas = [
['Eu próprio', 'Auto-avaliação', 'self'],
['[NOME DA CHEFIA]', 'A minha chefia', 'chefia'],
['[SUBORDINADO A]', 'Subordinado directo', 'sub'],
['[SUBORDINADO B]', 'Subordinado directo', 'sub']
];
var sel = this.state.sel;
var tipo = pessoas[sel][2];
var comp = [
['Orientação para o cliente', 'Compreende e responde às necessidades dos clientes, internos e externos.'],
['Trabalho em equipa', 'Colabora, partilha informação e apoia os colegas.'],
['Comunicação', 'Expressa-se com clareza e ouve os outros.'],
['Responsabilidade e rigor', 'Cumpre o que assume, com qualidade e atenção ao detalhe.'],
['Iniciativa', 'Antecipa problemas e propõe soluções sem esperar que lhe peçam.'],
tipo === 'chefia' ? ['Liderança', 'Orienta, apoia e desenvolve a equipa, e dá feedback útil.'] : ['Cumprimento de prazos', 'Entrega o trabalho dentro dos prazos combinados.']
];
var etiquetas = ['Insuficiente', 'A melhorar', 'Adequado', 'Bom', 'Excelente'];
var respondidas = 0;
var perguntas = comp.map(function (c, i) {
var v = self.state.resp[i];
if (v) respondidas++;
return {
nome: c[0], desc: c[1],
opcoes: etiquetas.map(function (e, j) {
var on = v === j + 1;
return {
n: String(j + 1), label: e, checked: on ? 'true' : 'false',
pick: function () { var r = Object.assign({}, self.state.resp); r[i] = j + 1; self.setState({ resp: r, erro: '' }); },
style: 'min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; font-family: inherit; cursor: pointer; ' + (on ? 'border: 1px solid #7CC6EE; background: #2397D4; color: #FFFFFF' : 'border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); color: rgba(235,235,245,0.78)')
};
})
};
});
var pill = 'display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap; ';
var feito = 'background: rgba(48,209,88,0.12); color: #30D158', pend = 'background: rgba(201,130,42,0.14); color: #C9822A', cur = 'background: rgba(35,151,212,0.2); color: #7CC6EE';
var feitos = this.state.feitos;
var enviado = !!feitos[sel];
var tarefas = pessoas.map(function (p, i) {
var f = !!feitos[i];
var est = f ? 'Concluída' : (i === sel ? 'Em curso' : 'Pendente');
return {
quem: p[0], papel: p[1], estado: est, estStyle: pill + (f ? feito : (i === sel ? cur : pend)), on: i === sel ? 'true' : 'false',
pick: function () { self.setState({ sel: i, resp: {}, erro: '' }); },
box: 'width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; font-family: inherit; cursor: pointer; ' + (i === sel ? 'background: rgba(35,151,212,0.14); border: 1px solid #2397D4' : 'background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12)')
};
});
var faltam = pessoas.filter(function (p, i) { return !feitos[i]; }).length;
var proximo = -1;
pessoas.forEach(function (p, i) { if (proximo < 0 && !feitos[i]) proximo = i; });
var titulos = { self: 'Auto-avaliação', chefia: 'A avaliar a minha chefia', sub: 'A avaliar um subordinado directo' };
var notas = { self: 'A sua auto-avaliação é vista por si e pela sua chefia.', chefia: 'Anónima: a sua chefia só vê a média das avaliações da equipa.', sub: 'O seu subordinado vê esta avaliação na reunião de resultado.' };
var __me = this;
var __pill = 'display: inline-flex; align-items: center; justify-content: center; text-decoration: none; height: 36px; width: 38px; border: none; border-radius: 10px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; ';
var __en = false;
return { dkPThref: 'ColabAvaliacao.dc.html', dkENhref: 'ColabAvaliacao_en.dc.html', dkPT: function () { try { window.localStorage.setItem('naval-lang', 'pt'); } catch (e) {} __me.forceUpdate(); }, dkEN: function () { try { window.localStorage.setItem('naval-lang', 'en'); } catch (e) {} __me.forceUpdate(); }, dkPTs: __pill + (__en ? 'background: transparent; color: rgba(235,235,245,0.7)' : 'background: #2397D4; color: #FFFFFF'), dkENs: __pill + (__en ? 'background: #2397D4; color: #FFFFFF' : 'background: transparent; color: rgba(235,235,245,0.7)'), dk: __en ? {home: 'Home', sales: 'Sales', cc: 'Accounts', stock: 'Inventory', exec: 'Executive', ccu: 'Cost centres', forn: 'Suppliers', frota: 'Fleet', colab: 'Human Resources', org: 'Organisation', phone: 'Mobile', out: 'Sign out'} : {home: 'Início', sales: 'Vendas', cc: 'Contas', stock: 'Stock', exec: 'Executivo', ccu: 'Centros de custo', forn: 'Fornecedores', frota: 'Frota', colab: 'Recursos Humanos', org: 'Organização', phone: 'Telemóvel', out: 'Sair'}, 
tarefas: tarefas, perguntas: perguntas,
enviado: enviado, aResponder: !enviado,
papelTit: titulos[tipo], quemTit: pessoas[sel][0], nota: notas[tipo],
msgOk: 'Obrigado. A avaliação de ' + pessoas[sel][0] + ' foi registada.' + (faltam ? (faltam === 1 ? ' Falta 1 avaliação para concluir este ciclo.' : ' Faltam ' + faltam + ' avaliações para concluir este ciclo.') : ' Concluiu todas as avaliações deste ciclo.'),
haMais: faltam > 0, seguinteTxt: 'Avaliar a seguinte',
seguinte: function () { if (proximo >= 0) self.setState({ sel: proximo, resp: {}, erro: '' }); },
progresso: respondidas + ' de ' + comp.length + ' respondidas',
barra: 'height: 100%; border-radius: 99px; background: #2397D4; width: ' + Math.round(respondidas / comp.length * 100) + '%',
erro: this.state.erro,
enviar: function () {
if (respondidas < comp.length) { self.setState({ erro: 'Responda a todas as competências antes de enviar.' }); return; }
var fz = Object.assign({}, self.state.feitos); fz[sel] = true; self.setState({ feitos: fz, erro: '' });
}
};
}
}
DC.mount(Component);
</script>

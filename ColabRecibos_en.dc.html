<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { pedido: null, codigo: '', erro: '', ok: null };
}
renderVals() {
var self = this;
var meses = ['Outubro', 'September', 'August', 'July', 'June', 'May', 'April', 'March', 'February', 'January'];
var recibos = meses.map(function (m, i) {

<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { passo: 0, fams: { 1: true }, docs: {} };
}
renderVals() {
var self = this;
var s = this.state.passo;
var nomes = ['Company', 'Contacts', 'What you supply', 'Documents'];
var passos = nomes.map(function (n, i) {
var feito = i <= s;
return {
label: (i + 1) + '. ' + n,
barra: 'height: 6px; border-radius: 99px; background: ' + (i === s ? '#7CC6EE' : (feito ? '#2397D4' : 'rgba(255,255,255,0.08)')),
txtStyle: 'font-size: 13px; color: ' + (i === s ? '#7CC6EE; font-weight: 500' : (feito ? 'rgba(235,235,245,0.78)' : 'rgba(235,235,245,0.45)'))
};
});
var chip = 'height: 44px; padding: 0 16px; border-radius: 99px; font-family: inherit; font-size: 14px; cursor: pointer; ';
var familias = ['Food', 'Consumables', 'Hygiene and cleaning', 'Packaging', 'Parts and bearings', 'Electrical materials', 'Construction', 'Transport services'].map(function (f, i) {
var on = !!self.state.fams[i];
return {
label: f, pressed: on ? 'true' : 'false',
style: chip + (on ? 'border: 1px solid #7CC6EE; background: rgba(35,151,212,0.2); color: #FFFFFF' : 'border: 1px solid rgba(255,255,255,0.18); background: transparent; color: rgba(235,235,245,0.78)'),
toggle: function () { var x = Object.assign({}, self.state.fams); x[i] = !x[i]; self.setState({ fams: x }); }
};
});
var docs = ['Tax clearance certificate (AGT)', 'Social security clearance certificate (INSS)', 'Commercial registry certificate', 'Trading licence', 'Proof of IBAN'].map(function (d, i) {
var ok = !!self.state.docs[i];
return {
nome: d, label: ok ? 'Uploaded ✓' : 'Upload PDF',
style: 'height: 40px; padding: 0 16px; border-radius: 12px; font-family: inherit; font-size: 14px; cursor: pointer; ' + (ok ? 'border: 1px solid rgba(48,209,88,0.5); background: rgba(48,209,88,0.1); color: #30D158' : 'border: 1px dashed rgba(255,255,255,0.18); background: transparent; color: rgba(235,235,245,0.78)'),
toggle: function () { var x = Object.assign({}, self.state.docs); x[i] = !x[i]; self.setState({ docs: x }); }
};

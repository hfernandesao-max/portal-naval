<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo Naval - Projectos Digitais</title>
<link rel="icon" href="assets/naval-simbolo.png">
<style>
:root{--bg:#070B1F;--card:rgba(255,255,255,0.06);--line:rgba(255,255,255,0.12);--tx:#F5F5F7;--mut:rgba(235,235,245,0.62);--acc:#7CC6EE;--blue:#2397D4;--okt:#5BE07F;--warnt:#E0A458;--badt:#FF8A84}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:1920px;height:1080px;flex:0 0 auto;transform-origin:center center;padding:56px 72px 48px;display:flex;flex-direction:column;gap:20px;
 background:radial-gradient(1200px 700px at 85% -10%,rgba(60,121,190,0.24),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(40,62,129,0.30),transparent 60%),#070B1F}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:22px}
.brand img{height:64px}
.eyebrow{font-size:18px;letter-spacing:2px;color:#7CC6EE;text-transform:uppercase}
h1{margin:4px 0 0;font-size:52px;font-weight:600;letter-spacing:-1px;line-height:1.05}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.badge{font-size:16px;font-weight:600;padding:6px 14px;border-radius:99px;background:rgba(60,121,190,0.18);color:#9CC4EA;border:1px solid rgba(60,121,190,0.5)}
.lang{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,0.06)}
.lang a{font-size:15px;font-weight:600;text-decoration:none;color:var(--mut);padding:6px 12px;border-radius:9px}
.lang a.on{background:var(--blue);color:#fff}
body.embed .lang{display:none}
.xbtn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:15px;font-weight:600;color:#fff;background:#3C79BE;border:1px solid rgba(156,196,234,0.5);border-radius:11px;padding:8px 14px;cursor:pointer}
.xbtn:hover{background:#2F68A8}a.xbtn{text-decoration:none}.xbtn.ghost{background:transparent;color:#9CC4EA}.xbtn.ghost:hover{background:rgba(60,121,190,0.18)}.xbtn svg{width:17px;height:17px}
.mrow{display:flex;align-items:center;gap:10px}
#xm{position:fixed;inset:0;background:rgba(3,6,20,0.72);display:none;align-items:center;justify-content:center;z-index:50;font-family:inherit}
#xm.on{display:flex}
#xm .dlg{width:min(440px,calc(100vw - 32px));background:#121A36;border:1px solid rgba(156,196,234,0.35);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;color:#F5F5F7;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
#xm h3{margin:0;font-size:19px}#xm p{margin:0;font-size:14px;color:rgba(235,235,245,0.7);line-height:1.45}
#xm input{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid rgba(156,196,234,0.4);background:#0A1028;color:#fff}
#xm .act{display:flex;justify-content:flex-end;gap:10px}
#xm .act button{font-family:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid rgba(156,196,234,0.4);background:transparent;color:#F5F5F7}
#xm .act button.ok{background:#3C79BE;border-color:#3C79BE}
#xm .msg{font-size:13px;min-height:18px;color:#FF8A84}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.10)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{padding:16px 22px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .n{font-size:16px;color:var(--mut)}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:16px}
.box{padding:18px 22px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bh h2{margin:0;font-size:21px;font-weight:600}
.bh span{font-size:15px;color:var(--mut)}
.sec{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin-top:6px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden}
.leg{display:flex;flex-direction:column;gap:7px}
.leg div{display:flex;align-items:center;gap:10px;font-size:16px}
.leg i{flex:0 0 auto;width:11px;height:11px;border-radius:3px}
.leg b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.leg em{font-style:normal;color:var(--mut);font-size:14px;min-width:44px;text-align:right}
.mods{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-height:0}
.mod{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:center;font-size:16px}
.mod .bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,0.06)}
.mod .bar span{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;min-width:0;overflow:hidden}
.keys{display:flex;gap:18px;font-size:14px;color:var(--mut)}
.keys span{display:flex;align-items:center;gap:7px}.keys i{width:11px;height:11px;border-radius:3px}
.risk{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.35}
.risk .p{flex:0 0 auto;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:7px;margin-top:1px;min-width:62px;text-align:center}
.risks{display:flex;flex-direction:column;justify-content:space-between;gap:10px;flex:1;min-height:0}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:flex;gap:12px;font-size:16px;line-height:1.35;counter-increment:s}
.steps li::before{content:counter(s);flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:rgba(35,151,212,0.22);color:#7CC6EE;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.foot{display:flex;justify-content:space-between;gap:16px;font-size:15px;color:rgba(235,235,245,0.45)}
.foot a{color:var(--acc);text-decoration:none}
body.d1 .risk,body.d1 .steps li,body.d1 .leg div,body.d1 .mod{font-size:14px}
body.flow{display:block;overflow:auto}
body.flow .stage{width:auto;height:auto;transform:none !important;padding:20px 16px 28px;gap:14px}
body.flow h1{font-size:30px}
body.flow .brand img{height:40px}
body.flow .top{flex-wrap:wrap}
body.flow .meta{align-items:flex-start}
body.flow .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
body.flow .kpi .v{font-size:28px}
body.flow .main{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
body.flow .box{overflow:visible}
body.flow .mod{grid-template-columns:120px minmax(0,1fr);font-size:14px}
body.flow .mods{gap:8px}
body.flow .foot{flex-direction:column}
@media print{body{display:block}.stage{transform:none !important}@page{size:1920px 1080px;margin:0}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>document.write('<script src="data/projectos-digitais.js?t=' + Date.now() + '"><\/script><script src="data/acessos-resumo.js?t=' + Date.now() + '"><\/script><script src="matriz-acessos.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(function () {
  var D = window.PD || {}, A = D.acessos || { grupos: [] }, X = D.acessosAnalise || { niveis: [], modulos: [], riscos: [], passos: [], credito: {} };
  var q = new URLSearchParams(location.search), EN;
  if (q.get('lang')) EN = q.get('lang') === 'en';
  else { var p = null; try { p = localStorage.getItem('naval-lang'); } catch (e) {} EN = p ? p === 'en' : !/^pt/i.test(navigator.language || 'pt'); }
  var L = function (o) { return o == null ? '' : (typeof o === 'string' ? o : (EN ? o.en : o.pt)); };
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var MES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var dt = function (iso, ano) { if (!iso || !/^\d{4}-\d\d-\d\d$/.test(iso)) return iso || ''; var x = iso.split('-'); return EN ? (+x[2]) + ' ' + MES[+x[1] - 1] + (ano ? ' ' + x[0] : '') : x[2] + '-' + x[1] + (ano ? '-' + x[0] : ''); };
  document.documentElement.lang = EN ? 'en' : 'pt-PT';
  document.title = EN ? 'Grupo Naval - Digital Projects' : 'Grupo Naval - Projectos Digitais';
  var tot = A.grupos.reduce(function (a, g) { return a + g.n; }, 0) || 1;
  var G = {}; A.grupos.forEach(function (g, i) { G[i] = g; });
  var trat = (G[0] ? G[0].n : 0) + (G[1] ? G[1].n : 0) + (G[2] ? G[2].n : 0);
  var adm = X.niveis.filter(function (n) { return n.pt === 'Administrador' || n.pt === 'Super'; }).reduce(function (a, n) { return a + n.n; }, 0);
  var pct = function (n) { return Math.round(n / tot * 100) + '%'; };
  var h = '';
  h += '<div class="top"><div class="brand"><img src="assets/naval-logo.png" alt="Naval"><div><div class="eyebrow">Cegid Evolution ERP Primavera · ' + (EN ? 'Security' : 'Segurança') + '</div><h1>' + (EN ? 'ERP access review' : 'Revisão de acessos ao ERP') + '</h1></div></div>';
  h += '<div class="meta"><div class="mrow"><a class="xbtn ghost" id="ebtn" href="matriz.html" target="_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>' + (EN ? 'Update matrix' : 'Actualizar matriz') + '</a><button type="button" class="xbtn" id="xbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>' + (EN ? 'Export to Excel' : 'Exportar para Excel') + '</button><span class="badge">' + (EN ? 'Status as of ' : 'Situação a ') + dt(A.data, true) + '</span></div><div class="lang"><a href="?lang=pt" data-l="pt"' + (EN ? '' : ' class="on"') + '>PT</a><a href="?lang=en" data-l="en"' + (EN ? ' class="on"' : '') + '>EN</a></div></div></div>';
  var K = [
    [EN ? 'Accounts reviewed' : 'Contas analisadas', String(tot), (EN ? 'in ' : 'em ') + X.empresas + (EN ? ' companies' : ' empresas'), '#F5F5F7'],
    [EN ? 'Decision taken' : 'Com decisão', trat + ' / ' + tot, pct(trat) + (EN ? ' · keep, create or deactivate' : ' · manter, criar ou desactivar'), '#9CC4EA'],
    [EN ? 'No reply · being blocked' : 'Sem resposta · a bloquear', String(G[4] ? G[4].n : 0), pct(G[4] ? G[4].n : 0) + (EN ? ' · deadline was ' : ' · prazo terminou a ') + dt(A.prazo || '2026-10-16'), '#FF8A84'],
    [EN ? 'Administrator or Super level' : 'Nível Administrador ou Super', String(adm), (EN ? 'priority in the review' : 'prioridade na revisão'), '#E0A458']
  ];
  h += '<div class="kpis">' + K.map(function (k) { return '<div class="card kpi"><span class="l">' + esc(k[0]) + '</span><span class="v" style="color:' + k[3] + '">' + esc(k[1]) + '</span><span class="n">' + esc(k[2]) + '</span></div>'; }).join('') + '</div>';
  h += '<div class="main">';
  // coluna 1: decisão por conta + nível actual
  h += '<div class="card box"><div class="bh"><h2>' + (EN ? 'Decision per account' : 'Decisão por conta') + '</h2><span>' + tot + (EN ? ' accounts' : ' contas') + '</span></div>';
  h += '<div class="stack">' + A.grupos.map(function (g) { return '<div style="flex:' + g.n + ';background:' + g.cor + '"></div>'; }).join('') + '</div>';
  h += '<div class="leg">' + A.grupos.map(function (g) { return '<div><i style="background:' + g.cor + '"></i>' + esc(L(g)) + '<b>' + g.n + '</b><em>' + pct(g.n) + '</em></div>'; }).join('') + '</div>';
  h += '<div class="sec">' + (EN ? 'Current level in the ERP' : 'Nível actual no ERP') + '</div>';
  h += '<div class="stack">' + X.niveis.map(function (g) { return '<div style="flex:' + g.n + ';background:' + g.cor + '"></div>'; }).join('') + '</div>';
  h += '<div class="leg">' + X.niveis.map(function (g) { return '<div><i style="background:' + g.cor + '"></i>' + esc(L(g)) + '<b>' + g.n + '</b><em>' + pct(g.n) + '</em></div>'; }).join('') + '</div>';
  h += '<div class="sec">' + (EN ? 'Next steps' : 'Próximos passos') + '</div><ol class="steps">' + X.passos.map(function (s) { return '<li>' + esc(L(s)) + '</li>'; }).join('') + '</ol></div>';
  // coluna 2: perfis por módulo
  var CT = '#2397D4', CC = '#7B87E0', CS = 'rgba(235,235,245,0.18)';
  h += '<div class="card box"><div class="bh"><h2>' + (EN ? 'Access profile by module' : 'Perfil de acesso por módulo') + '</h2><span>' + X.perfis + (EN ? ' profiles defined' : ' perfis definidos') + '</span></div>';
  h += '<div class="keys"><span><i style="background:' + CT + '"></i>' + (EN ? 'Full (view and post)' : 'Total (consultar e registar)') + '</span><span><i style="background:' + CC + '"></i>' + (EN ? 'View only' : 'Só consulta') + '</span><span><i style="background:' + CS + '"></i>' + (EN ? 'No access' : 'Sem acesso') + '</span></div>';
  h += '<div class="mods">' + X.modulos.map(function (m) {
    var seg = function (n, c, dark) { return n ? '<span style="flex:' + n + ';background:' + c + (dark ? ';color:rgba(235,235,245,0.75)' : '') + '">' + n + '</span>' : ''; };
    return '<div class="mod"><span>' + esc(L(m)) + '</span><div class="bar">' + seg(m.t, CT) + seg(m.c, CC) + seg(m.s, CS, 1) + '</div></div>';
  }).join('') + '</div>';
  var cr = X.credito || {};
  h += '<div style="display:flex;align-items:center;gap:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);font-size:16px"><span style="font-size:30px;font-weight:600;color:#E0A458;font-variant-numeric:tabular-nums">' + cr.sim + '/' + cr.total + '</span><span>' + (EN ? 'profiles may issue credit documents (money leaves the company). Default rule: "No".' : 'perfis podem emitir documentos de crédito (saída de dinheiro). Regra por defeito: «Não».') + '</span></div></div>';
  // coluna 3: riscos
  var PR = { alto: ['rgba(255,105,97,0.18)', '#FF8A84', EN ? 'High' : 'Alto'], medio: ['rgba(201,130,42,0.18)', '#E0A458', EN ? 'Medium' : 'Médio'], baixo: ['rgba(124,198,238,0.16)', '#7CC6EE', EN ? 'Low' : 'Baixo'] };
  h += '<div class="card box"><div class="bh"><h2>' + (EN ? 'Risks found' : 'Riscos identificados') + '</h2><span>' + X.riscos.length + (EN ? ' points' : ' pontos') + '</span></div><div class="risks">' +
    X.riscos.map(function (r) { var c = PR[r.nivel] || PR.baixo; return '<div class="risk"><span class="p" style="background:' + c[0] + ';color:' + c[1] + '">' + c[2] + '</span><span>' + esc(L(r)) + '</span></div>'; }).join('') + '</div></div>';
  h += '</div>';
  h += '<div class="foot"><span>' + esc(L(X.fonte)) + ' · ' + (EN ? 'aggregated figures, no personal data' : 'números agregados, sem dados pessoais') + '</span><a href="ponto-situacao.html?lang=' + (EN ? 'en' : 'pt') + '">' + (EN ? 'Full status update →' : 'Ponto de situação completo →') + '</a></div>';
  var st = document.getElementById('stage'); st.innerHTML = h;
  st.querySelectorAll('.lang a').forEach(function (a) { a.addEventListener('click', function () { try { localStorage.setItem('naval-lang', a.getAttribute('data-l')); } catch (e) {} }); });
  if (window.self !== window.top) document.body.classList.add('embed');
  function fit() {
    var w = window.innerWidth, hh = window.innerHeight;
    if (w < 900 || w / hh < 1.1) { document.body.classList.add('flow'); st.style.transform = ''; return; }
    document.body.classList.remove('flow');
    st.style.transform = 'scale(' + Math.min(w / 1920, hh / 1080) + ')';
    document.body.classList.remove('d1');
    var over = Array.prototype.some.call(document.querySelectorAll('.box'), function (e) { return e.scrollHeight > e.clientHeight + 1; });
    if (over) document.body.classList.add('d1');
  }
  window.addEventListener('resize', fit); fit();

  /* Exportação da matriz de acessos: dados cifrados (AES-GCM) em data/acessos-matriz.enc.json; o Excel é gerado no browser. */
  var T = EN ? { t: 'Export the access matrix', d: 'The matrix has names, e-mails and access levels, so it is protected. Enter the password to download it in Excel, with the same structure as the original file.', ph: 'Password', ok: 'Download Excel', no: 'Cancel', bad: 'Wrong password.', err: 'The file could not be generated. Check the internet connection and try again.', wait: 'Preparing the file…' }
             : { t: 'Exportar a matriz de acessos', d: 'A matriz tem nomes, e-mails e níveis de acesso, por isso está protegida. Introduza a palavra-passe para a descarregar em Excel, com a mesma estrutura do ficheiro original.', ph: 'Palavra-passe', ok: 'Descarregar Excel', no: 'Cancelar', bad: 'Palavra-passe errada.', err: 'Não foi possível gerar o ficheiro. Verifique a ligação à internet e tente de novo.', wait: 'A preparar o ficheiro…' };
  var m = document.createElement('div'); m.id = 'xm';
  m.innerHTML = '<form class="dlg" autocomplete="off"><h3>' + T.t + '</h3><p>' + T.d + '</p><input type="password" id="xpw" placeholder="' + T.ph + '" aria-label="' + T.ph + '"><div class="msg" id="xmsg" role="status"></div><div class="act"><button type="button" id="xno">' + T.no + '</button><button type="submit" class="ok" id="xok">' + T.ok + '</button></div></form>';
  document.body.appendChild(m);
  var msg = m.querySelector('#xmsg'), pw = m.querySelector('#xpw'), okb = m.querySelector('#xok');
  var abrir = function () { m.classList.add('on'); msg.textContent = ''; pw.value = ''; setTimeout(function () { pw.focus(); }, 30); };
  var fechar = function () { m.classList.remove('on'); };
  document.getElementById('xbtn').addEventListener('click', abrir);
  m.querySelector('#xno').addEventListener('click', fechar);
  m.addEventListener('click', function (e) { if (e.target === m) fechar(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fechar(); });
  m.querySelector('form').addEventListener('submit', async function (e) {
    e.preventDefault(); if (!pw.value) { pw.focus(); return; }
    okb.disabled = true; msg.style.color = 'rgba(235,235,245,0.7)'; msg.textContent = T.wait;
    try { var F = await MA.carregar(); var M = await MA.decifrarTexto(F.E, pw.value); MA.descarregar(await MA.excel(M)); fechar(); }
    catch (x) { msg.style.color = '#FF8A84'; msg.textContent = x && x.message === 'senha' ? T.bad : T.err; }
    okb.disabled = false;
  });
})();
</script>
</body>
</html>

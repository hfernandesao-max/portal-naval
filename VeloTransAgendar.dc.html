<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { passo: 0, eq: 0, sv: 0, dia: 0, hora: '', erro: '' };
}
renderVals() {
var self = this;
var p = this.state.passo;
var nomes = ['Viatura', 'Serviço', 'Dia e hora', 'Confirmar'];
var passos = nomes.map(function (n, i) {
var feito = i <= p;
return { label: (i + 1) + '. ' + n, barra: 'height: 6px; border-radius: 99px; background: ' + (i === p ? '#7CC6EE' : (feito ? '#2397D4' : 'rgba(255,255,255,0.10)')), txtStyle: 'font-size: 13px; color: ' + (i === p ? '#7CC6EE; font-weight: 500' : (feito ? 'rgba(235,235,245,0.78)' : 'rgba(235,235,245,0.45)')) };
});
var card = 'width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; font-family: inherit; cursor: pointer; ';
var eqs = [
['Toyota Hilux 2.4 · LD-XX-XX-11', 'Atribuída a si · 84 320 km · seguro válido até 03/2027', 'Revisão dos 90 000 km em breve', 'w'],
['Toyota Corolla · LD-XX-XX-12', 'Viatura de serviço partilhada · 41 900 km', 'Inspecção periódica em atraso', 'c']
];
var equip = eqs.map(function (e, i) {
var on = self.state.eq === i;
var al = e[3] === 'c' ? 'background: rgba(255,69,58,0.16); color: #FF6961' : (e[3] === 'w' ? 'background: rgba(201,130,42,0.16); color: #E0A04A' : 'background: rgba(48,209,88,0.12); color: #30D158');
return { nome: e[0], serie: e[1], alerta: e[2], on: on ? 'true' : 'false', alertStyle: 'flex: none; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; ' + al, style: card + (on ? 'background: rgba(35,151,212,0.16); border: 1px solid #2397D4' : 'background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12)'), pick: function () { self.setState({ eq: i, erro: '' }); } };
});
var svs = [
['Revisão periódica', 'Revisão por quilómetros segundo o plano da marca: óleo, filtros e verificação geral.', 'Cerca de 3 horas'],
['Pneus e alinhamento', 'Substituição de pneus, calibragem e alinhamento da direcção.', 'Cerca de 1 hora'],
['Diagnóstico de avaria', 'Luz de aviso, ruído ou comportamento anormal da viatura.', 'Cerca de 2 horas'],
['Inspecção periódica obrigatória', 'Preparação e acompanhamento da viatura à inspecção.', 'Meio dia']

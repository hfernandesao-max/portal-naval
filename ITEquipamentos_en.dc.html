super(props);
this.state = { tab: 'eq', tipo: 'todos', bloq: {}, rec: {}, ac: {}, ped: {} };
}
renderVals() {
var self = this;
var mask = function (t) { var g = 'radial-gradient(farthest-side, transparent calc(100% - ' + t + 'px), #000 calc(100% - ' + (t - 1) + 'px))'; return '-webkit-mask: ' + g + '; mask: ' + g + '; '; };
var arco = function (frac, col, s, t) { var d = (Math.min(frac, 1) * 270).toFixed(1); return { glow: 'position: relative; width: ' + s + 'px; height: ' + s + 'px; flex: 0 0 auto; filter: drop-shadow(0 0 6px ' + col + ')', track: 'position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 225deg, rgba(255,255,255,0.08) 0deg 270deg, transparent 270deg 360deg); ' + mask(t), ring: 'position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 225deg, ' + col + ' 0deg ' + d + 'deg, transparent ' + d + 'deg 360deg); ' + mask(t) }; };

<sc-for list="{{linhas}}" as="l" hint-placeholder-count="4">
<tr style="border-top: 1px solid rgba(255,255,255,0.08)">
<td style="padding: 12px 10px"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">{{l.nome}}</span><span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-variant-numeric: tabular-nums; font-size: 11px; color: rgba(235,235,245,0.6)">{{l.cod}}</span></div></td>
<td style="padding: 12px 10px; text-align: right; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-variant-numeric: tabular-nums">{{l.qtdTxt}}</td>
<td style="padding: 12px 10px"><input type="text" inputmode="decimal" aria-label="{{l.aria}}" value="{{l.preco}}" onChange="{{l.setPreco}}" placeholder="0" style="height: 40px; width: 150px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; padding: 0 12px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-variant-numeric: tabular-nums; font-size: 14px; background: rgba(255,255,255,0.05); color: #F5F5F7; text-align: right"></td>
<td style="padding: 12px 10px"><select aria-label="Availability" style="height: 40px; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; padding: 0 10px; font-family: inherit; font-size: 13px; background: rgba(255,255,255,0.05); color: #F5F5F7"><option>In stock</option><option>Made to order</option><option>Not supplied</option></select></td>
<td style="padding: 12px 10px; text-align: right; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-variant-numeric: tabular-nums">{{l.totalTxt}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="display: flex; justify-content: flex-end; align-items: baseline; gap: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.12)">
<span style="font-size: 14px; color: rgba(235,235,245,0.6)">Quote total, excluding VAT</span>
<span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 500; color: #7CC6EE">{{totalTxt}} Kz</span>
</div>
</section>
<section style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); padding: 20px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Quote terms</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="prazo" style="font-size: 13px; color: rgba(235,235,245,0.78)">Delivery time (days)</label>
<input id="prazo" type="text" inputmode="numeric" value="{{prazo}}" onChange="{{setPrazo}}" style="height: 44px; border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 0 12px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; background: rgba(255,255,255,0.05); color: #F5F5F7">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cond" style="font-size: 13px; color: rgba(235,235,245,0.78)">Payment terms</label>
<select id="cond" style="height: 44px; border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 0 12px; font-family: inherit; font-size: 15px; background: rgba(255,255,255,0.05); color: #F5F5F7"><option>30 days after invoice</option><option>60 days after invoice</option><option>Immediate payment</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="val" style="font-size: 13px; color: rgba(235,235,245,0.78)">Quote validity</label>
<select id="val" style="height: 44px; border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 0 12px; font-family: inherit; font-size: 15px; background: rgba(255,255,255,0.05); color: #F5F5F7"><option>15 days</option><option>30 days</option><option>60 days</option></select>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="obs" style="font-size: 13px; color: rgba(235,235,245,0.78)">Notes</label>
<textarea id="obs" rows="3" placeholder="Brand, warranty, delivery terms…" style="border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 10px 12px; font-family: inherit; font-size: 14px; background: rgba(255,255,255,0.05); color: #F5F5F7; resize: vertical"></textarea>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-top: 4px">
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.18); background: transparent; color: rgba(235,235,245,0.78); font-family: inherit; font-size: 14px">Attach quote as PDF (optional)</button>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<button type="button" onClick="{{enviar}}" style="height: 48px; padding: 0 28px; border-radius: 12px; border: none; background: #2397D4; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer">Submit quote</button>
<span style="{{erroStyle}}">{{erro}}</span>
</div>
</div>
</section>
</sc-if>
</main>

</div>
</script>
<div id="dc-app"></div>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { precos: ['18500', '', '', ''], prazo: '7', enviado: false, erro: '' };
}
renderVals() {
var self = this;
var fmt = function (n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
var num = function (s) { var v = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isNaN(v) ? 0 : v; };
var artigos = [
['Deep groove ball bearing 6205', 'PEC-02291', 200, 'units'],
['Oil seal 35×52×7', 'PEC-01845', 150, 'units'],
['V-belt A-42', 'PEC-00977', 60, 'units'],
['Multipurpose grease 18 kg', 'PEC-03310', 10, 'buckets']
];
var total = 0;
var linhas = artigos.map(function (a, i) {
var p = self.state.precos[i];
var t = num(p) * a[2];
total += t;
return {
nome: a[0], cod: a[1], qtdTxt: a[2] + ' ' + a[3], preco: p, aria: 'Unit price of ' + a[0],
totalTxt: t ? fmt(t) : '—',
setPreco: function (e) { var ps = self.state.precos.slice(); ps[i] = e.target.value; self.setState({ precos: ps, erro: '' }); }
};
});
var vazios = this.state.precos.filter(function (p) { return !num(p); }).length;
var __me = this;
var __pill = 'display: inline-flex; align-items: center; justify-content: center; text-decoration: none; height: 36px; width: 38px; border: none; border-radius: 10px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; ';
var __en = true;
return { dkPThref: 'FornResposta.dc.html', dkENhref: 'FornResposta_en.dc.html', dkPT: function () { try { window.localStorage.setItem('naval-lang', 'pt'); } catch (e) {} __me.forceUpdate(); }, dkEN: function () { try { window.localStorage.setItem('naval-lang', 'en'); } catch (e) {} __me.forceUpdate(); }, dkPTs: __pill + (__en ? 'background: transparent; color: rgba(235,235,245,0.7)' : 'background: #2397D4; color: #FFFFFF'), dkENs: __pill + (__en ? 'background: #2397D4; color: #FFFFFF' : 'background: transparent; color: rgba(235,235,245,0.7)'), dk: __en ? {home: 'Home', sales: 'Sales', cc: 'Accounts', stock: 'Inventory', exec: 'Executive', ccu: 'Cost centres', forn: 'Suppliers', frota: 'Fleet', colab: 'Human Resources', org: 'Organisation', phone: 'Mobile', out: 'Sign out'} : {home: 'Home', sales: 'Sales', cc: 'Accounts', stock: 'Inventory', exec: 'Executive', ccu: 'Cost centres', forn: 'Suppliers', frota: 'Fleet', colab: 'Human Resources', org: 'Organisation', phone: 'Mobile', out: 'Sign out'}, 
linhas: linhas, totalTxt: fmt(total), prazo: this.state.prazo,
enviado: this.state.enviado, editando: !this.state.enviado,
erro: this.state.erro, erroStyle: 'font-size: 13px; color: #FF6961; min-height: 18px',
setPrazo: function (e) { self.setState({ prazo: e.target.value, erro: '' }); },
enviar: function () {
if (vazios > 0) { self.setState({ erro: 'Enter a price for every item, or mark it as "Not supplied".' }); return; }
if (!num(self.state.prazo)) { self.setState({ erro: 'Enter the delivery time in days.' }); return; }
self.setState({ enviado: true, erro: '' });
},
editar: function () { self.setState({ enviado: false }); }
};
}
}
DC.mount(Component);
</script>
</body>
</html>

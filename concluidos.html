<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concluído e pendente · Projectos digitais</title>
<link rel="icon" href="assets/naval-simbolo.png">
<style>
:root{--bg:#070B1F;--card:rgba(255,255,255,0.05);--line:rgba(255,255,255,0.10);--tx:#F5F5F7;--mut:rgba(235,235,245,0.66);--acc:#7CC6EE;--blue:#2397D4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 700px at 85% -10%,rgba(60,121,190,0.24),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(40,62,129,0.30),transparent 60%),#070B1F;background-attachment:fixed;min-height:100vh}
.wrap{max-width:1680px;margin:0 auto;padding:28px 32px 36px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:52px}
.eyebrow{font-size:14px;letter-spacing:2px;color:#7CC6EE;text-transform:uppercase}
h1{margin:4px 0 0;font-size:38px;font-weight:600;letter-spacing:-0.6px;line-height:1.05}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.badge{font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;background:rgba(60,121,190,0.18);color:#9CC4EA;border:1px solid rgba(60,121,190,0.5)}
.lang{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,0.06)}
.lang a{font-size:13px;font-weight:600;text-decoration:none;color:var(--mut);padding:5px 11px;border-radius:9px}
.lang a.on{background:var(--blue);color:#fff}
body.embed .lang{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.08)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{padding:14px 18px;display:flex;align-items:center;gap:16px}
.kpi .v{font-size:36px;font-weight:600;font-variant-numeric:tabular-nums;color:#9CC4EA;line-height:1;white-space:nowrap}
.kpi .v small{font-size:20px;color:var(--mut);font-weight:500}
.kpi .l{font-size:15px;font-weight:600}
.kpi .n{font-size:13px;color:var(--mut);margin-top:2px}
.sec{padding:16px 20px 6px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px 10px;border-bottom:1px solid var(--line)}
.sh h2{margin:0;font-size:21px;font-weight:600;display:flex;align-items:center;gap:10px}
.sh h2 i{width:11px;height:11px;border-radius:50%;display:inline-block}
.sh span{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:11px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:rgba(235,235,245,0.5);text-align:left;padding:10px 10px 8px}
td{padding:11px 10px;vertical-align:top;border-top:1px solid rgba(255,255,255,0.06);font-size:14px;line-height:1.45}
tbody tr:first-child td{border-top:none}
col.c-proj{width:56px}col.c-tema{width:27%}col.c-est{width:150px}col.c-ex{width:150px}col.c-dt{width:110px}
.proj{font-size:11px;font-weight:700;letter-spacing:.6px}
.tema{font-size:15px;font-weight:500;color:var(--tx)}
.desc{color:rgba(235,235,245,0.82)}
.desc.vazio{color:rgba(235,235,245,0.35)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.ex{display:flex;align-items:center;gap:10px;padding-top:3px}
.bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,0.10);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.pc{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.dt{font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:rgba(235,235,245,0.45);flex-wrap:wrap}
.foot a{color:var(--acc);text-decoration:none}
@media (max-width:900px){
 .wrap{padding:18px 14px 28px}
 h1{font-size:28px}.brand img{height:40px}.meta{align-items:flex-start}
 .kpis{grid-template-columns:minmax(0,1fr)}
 table,tbody,tr,td{display:block;width:100%}
 thead,colgroup{display:none}
 tbody tr{padding:12px 4px;border-top:1px solid rgba(255,255,255,0.08)}
 tbody tr:first-child{border-top:none}
 td{border:none;padding:3px 0}
 td.c-proj{display:inline-block;width:auto;margin-right:8px}
 td.c-tema{display:inline;width:auto}
 td.c-est,td.c-ex,td.c-dt{display:inline-flex;width:auto;margin-right:14px;align-items:center;vertical-align:middle}
 .ex{min-width:150px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>document.write('<script src="data/projectos-digitais.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(function () {
  var D = window.PD || { tarefas: [] };
  var q = new URLSearchParams(location.search), EN;
  if (q.get('lang')) EN = q.get('lang') === 'en';
  else { var p = null; try { p = localStorage.getItem('naval-lang'); } catch (e) {} EN = p ? p === 'en' : !/^pt/i.test(navigator.language || 'pt'); }
  var L = function (o) { return o == null ? '' : (typeof o === 'string' ? o : (EN ? o.en : o.pt)); };
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var MES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var dt = function (iso, ano) { if (!iso || !/^\d{4}-\d\d-\d\d$/.test(iso)) return iso || ''; var x = iso.split('-'); return EN ? (+x[2]) + ' ' + MES[+x[1] - 1] + (ano ? ' ' + x[0] : '') : x[2] + '-' + x[1] + (ano ? '-' + x[0] : ''); };
  document.documentElement.lang = EN ? 'en' : 'pt-PT';
  document.title = (EN ? 'Done and pending' : 'Concluído e pendente') + ' · ' + (EN ? 'Digital projects' : 'Projectos digitais');
  if (window.self !== window.top) document.body.classList.add('embed');
  var TA = D.ordem ? D.ordem(D.ativos ? D.ativos(D.tarefas) : D.tarefas) : (D.tarefas || []);
  var ARQ = D.arquivados ? D.arquivados(D.tarefas).length : 0;
  var feitos = TA.filter(function (r) { return r.estado === 'concluido'; });
  var pend = TA.filter(function (r) { return r.estado !== 'concluido'; });
  var EST = EN ? { concluido: 'Done', definido: 'Defined', curso: 'In progress', previsto: 'Planned', aguarda: 'Waiting', bloqueado: 'Blocked' }
               : { concluido: 'Concluído', definido: 'Definido', curso: 'Em curso', previsto: 'Previsto', aguarda: 'A aguardar', bloqueado: 'Bloqueado' };
  var COR = { concluido: ['rgba(48,209,88,0.16)', '#5BE07F', '#30D158'], definido: ['rgba(124,198,238,0.16)', '#7CC6EE', '#7CC6EE'], curso: ['rgba(35,151,212,0.22)', '#5FB8E8', '#2397D4'], previsto: ['rgba(255,255,255,0.08)', 'rgba(235,235,245,0.75)', '#2397D4'], aguarda: ['rgba(201,130,42,0.18)', '#E0A458', '#C9822A'], bloqueado: ['rgba(255,105,97,0.16)', '#FF8A84', '#FF6961'] };
  var km = ((D.km30 || {}).passos || []);
  var V = D.vendas || { rotas: [], aVender: [] };
  var row = function (r, fim) {
    var c = COR[r.estado] || COR.previsto;
    var ex = r.pct != null ? '<div class="ex"><span class="bar"><i style="width:' + r.pct + '%;background:' + c[2] + '"></i></span><span class="pc" style="color:' + c[1] + '">' + r.pct + '%</span></div>'
                           : '<span style="color:#7CC6EE;font-weight:600">' + esc(L(r.valor)) + '</span>';
    var data, dcor = 'rgba(235,235,245,0.85)';
    if (fim) data = r.concl ? dt(r.concl) : '—';
    else if (r.prev == null) { data = EN ? 'TBC' : 'A definir'; dcor = 'rgba(235,235,245,0.45)'; }
    else { data = typeof r.prev === 'string' ? dt(r.prev) : L(r.prev); if (D.atrasado && D.atrasado(r)) dcor = '#E0A458'; }
    return '<tr><td class="c-proj"><span class="proj" style="color:' + (r.proj === 'RTM' ? '#7CC6EE' : '#B5A8F0') + '">' + r.proj + '</span></td>' +
      '<td class="c-tema"><span class="tema">' + esc(EN ? r.en : r.pt) + '</span></td>' +
      '<td class="c-desc"><span class="desc' + (r.det ? '' : ' vazio') + '">' + (r.det ? esc(L(r.det)) : '—') + '</span></td>' +
      '<td class="c-est"><span class="pill" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(EST[r.estado]) + '</span></td>' +
      '<td class="c-ex">' + ex + '</td>' +
      '<td class="c-dt"><span class="dt" style="color:' + dcor + '">' + esc(data) + '</span></td></tr>';
  };
  var thead = function (dataLbl) {
    return '<colgroup><col class="c-proj"><col class="c-tema"><col><col class="c-est"><col class="c-ex"><col class="c-dt"></colgroup><thead><tr><th>Proj.</th><th>' + (EN ? 'Topic' : 'Tema') + '</th><th>' + (EN ? 'Description' : 'Descrição') + '</th><th>' + (EN ? 'Status' : 'Estado') + '</th><th>' + (EN ? 'Completion' : 'Execução') + '</th><th>' + dataLbl + '</th></tr></thead>';
  };
  var h = '';
  h += '<div class="top"><div class="brand"><img src="assets/naval-logo.png" alt="Naval"><div><div class="eyebrow">' + (EN ? 'Digital projects · IT · Summary' : 'Projectos digitais · IT · Resumo') + '</div><h1>' + (EN ? 'Done and pending' : 'Concluído e pendente') + '</h1></div></div>';
  h += '<div class="meta"><span class="badge">' + (EN ? 'As of ' : 'Actualizado a ') + dt(D.actualizado, true) + '</span><div class="lang"><a href="?lang=pt" data-l="pt"' + (EN ? '' : ' class="on"') + '>PT</a><a href="?lang=en" data-l="en"' + (EN ? ' class="on"' : '') + '>EN</a></div></div></div>';
  h += '<div class="kpis">' +
    '<div class="card kpi"><span class="v">' + feitos.length + '<small> / ' + TA.length + '</small></span><div><div class="l">' + (EN ? 'Topics completed' : 'Temas concluídos') + '</div><div class="n">' + pend.length + (EN ? ' still in progress or pending' : ' ainda em curso ou pendentes') + '</div></div></div>' +
    '<div class="card kpi"><span class="v">' + V.aVender.length + '<small> / ' + V.rotas.length + '</small></span><div><div class="l">' + (EN ? 'RTM routes selling' : 'Rotas RTM a vender') + '</div><div class="n">' + esc(L(V.docs)) + '</div></div></div>' +
    '<div class="card kpi"><span class="v">' + km.filter(function (x) { return x.estado === 'concluido'; }).length + '<small> / ' + km.length + '</small></span><div><div class="l">' + (EN ? 'KM30 steps done' : 'Passos do KM30 concluídos') + '</div><div class="n">' + esc(L((D.km30 || {}).bloqueio)) + '</div></div></div></div>';
  h += '<section class="card sec"><div class="sh"><h2><i style="background:#3C79BE"></i>' + (EN ? 'Pending' : 'Pendente') + '</h2><span>' + pend.length + (EN ? ' topics · most critical first' : ' temas · do mais crítico para o menos crítico') + '</span></div><table>' + thead(EN ? 'Forecast' : 'Previsão') + '<tbody>' + pend.map(function (r) { return row(r, false); }).join('') + '</tbody></table></section>';
  h += '<section class="card sec"><div class="sh"><h2><i style="background:#30D158"></i>' + (EN ? 'Done' : 'Concluído') + '</h2><span>' + feitos.length + (EN ? ' topics · last ' : ' temas · últimos ') + (D.DIAS_CONCLUIDOS || 14) + (EN ? ' days' : ' dias') + (ARQ ? ' · ' + ARQ + (EN ? ' archived' : (ARQ === 1 ? ' arquivado' : ' arquivados')) : '') + '</span></div><table>' + thead(EN ? 'Completed on' : 'Concluído a') + '<tbody>' + feitos.map(function (r) { return row(r, true); }).join('') + '</tbody></table></section>';
  h += '<div class="foot"><span>Grupo Naval · ' + (EN ? 'Digital Projects' : 'Projectos Digitais') + '</span><a href="ponto-situacao.html?lang=' + (EN ? 'en' : 'pt') + '">' + (EN ? 'One-screen status update →' : 'Ponto de situação num ecrã →') + '</a></div>';
  var app = document.getElementById('app'); app.innerHTML = h;
  app.querySelectorAll('.lang a').forEach(function (a) { a.addEventListener('click', function () { try { localStorage.setItem('naval-lang', a.getAttribute('data-l')); } catch (e) {} }); });
})();
</script>
</body>
</html>

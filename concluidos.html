<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concluído · Projectos digitais</title>
<link rel="icon" href="assets/naval-simbolo.png">
<style>
:root{--bg:#070B1F;--card:rgba(255,255,255,0.06);--line:rgba(255,255,255,0.12);--tx:#F5F5F7;--mut:rgba(235,235,245,0.62);--acc:#7CC6EE;--blue:#2397D4;--ok:#30D158;--okt:#5BE07F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:1920px;height:1080px;flex:0 0 auto;transform-origin:center center;padding:56px 72px 48px;display:flex;flex-direction:column;gap:24px;
 background:radial-gradient(1100px 650px at 85% -10%,rgba(48,209,88,0.16),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(35,151,212,0.16),transparent 60%),#070B1F}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:22px}
.brand img{height:64px}
.eyebrow{font-size:18px;letter-spacing:2px;color:var(--okt);text-transform:uppercase}
h1{margin:4px 0 0;font-size:52px;font-weight:600;letter-spacing:-1px;line-height:1.05}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.badge{font-size:16px;font-weight:600;padding:6px 14px;border-radius:99px;background:rgba(48,209,88,0.14);color:var(--okt);border:1px solid rgba(48,209,88,0.35)}
.lang{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,0.06)}
.lang a{font-size:15px;font-weight:600;text-decoration:none;color:var(--mut);padding:6px 12px;border-radius:9px}
.lang a.on{background:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.10)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{padding:16px 22px;display:flex;align-items:center;gap:20px}
.kpi .v{font-size:48px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--okt);line-height:1}
.kpi .l{font-size:18px;font-weight:600}
.kpi .n{font-size:15px;color:var(--mut)}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.col{padding:20px 24px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow-y:auto}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.08)}
.ch h2{margin:0;font-size:24px;font-weight:600}
.ch span{font-size:16px;color:var(--mut)}
.it{display:grid;grid-template-columns:34px minmax(0,1fr) 70px;gap:14px;align-items:start;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.it:last-child{border-bottom:none}
.ck{width:28px;height:28px;border-radius:50%;background:rgba(48,209,88,0.18);display:flex;align-items:center;justify-content:center;margin-top:1px}
.ck svg{width:16px;height:16px;color:var(--okt)}
.t{font-size:19px;font-weight:500;line-height:1.25}
.d{font-size:15px;color:var(--mut);line-height:1.3;margin-top:2px}
.dt{font-size:17px;font-variant-numeric:tabular-nums;color:var(--acc);text-align:right;padding-top:2px}
/* pendentes */
.pd{display:grid;grid-template-columns:minmax(0,1fr) 168px 136px 96px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.pd:last-child{border-bottom:none}
.pill{display:inline-block;white-space:nowrap;font-size:14px;font-weight:600;padding:3px 11px;border-radius:99px;justify-self:start}
.ex{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,0.10);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.pc{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.pv{font-size:16px;font-variant-numeric:tabular-nums;text-align:right}
.tag{font-size:12px;font-weight:700;letter-spacing:.5px;margin-right:8px}
.it{padding:7px 0}
.sub{font-size:15px;color:var(--mut);margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{font-size:14px;padding:4px 10px;border-radius:10px;background:rgba(48,209,88,0.12);color:var(--okt)}
.foot{display:flex;justify-content:space-between;gap:16px;font-size:15px;color:rgba(235,235,245,0.45)}
.foot a{color:var(--acc);text-decoration:none}
body.flow{display:block;overflow:auto}
body.flow .stage{width:auto;height:auto;transform:none !important;padding:20px 16px 28px;gap:14px}
body.flow h1{font-size:30px}
body.flow .brand img{height:40px}
body.flow .top{flex-wrap:wrap}
body.flow .meta{align-items:flex-start}
body.flow .kpis{grid-template-columns:minmax(0,1fr);gap:10px}
body.flow .kpi .v{font-size:34px}
body.flow .cols{grid-template-columns:minmax(0,1fr)}
body.flow .t{font-size:16px}
body.flow .d{font-size:14px}
body.flow .dt{font-size:14px}
body.flow .ch h2{font-size:19px}
body.flow .foot{flex-direction:column}
body.flow .pd{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
body.flow .pd .ex{grid-column:1/2}
body.flow .pill{font-size:12px;white-space:normal}
body.embed .lang{display:none}
@media print{body{display:block}.stage{transform:none !important}@page{size:1920px 1080px;margin:0}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>document.write('<script src="data/projectos-digitais.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(function () {
  var D = window.PD || { tarefas: [] };
  var q = new URLSearchParams(location.search), EN;
  if (q.get('lang')) EN = q.get('lang') === 'en';
  else { var p = null; try { p = localStorage.getItem('naval-lang'); } catch (e) {} EN = p ? p === 'en' : !/^pt/i.test(navigator.language || 'pt'); }
  var L = function (o) { return o == null ? '' : (typeof o === 'string' ? o : (EN ? o.en : o.pt)); };
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  var MES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var dt = function (iso, ano) { if (!iso || !/^\d{4}-\d\d-\d\d$/.test(iso)) return iso || ''; var x = iso.split('-'); return EN ? (+x[2]) + ' ' + MES[+x[1] - 1] + (ano ? ' ' + x[0] : '') : x[2] + '-' + x[1] + (ano ? '-' + x[0] : ''); };
  document.documentElement.lang = EN ? 'en' : 'pt-PT';
  document.title = (EN ? 'Done and pending' : 'Concluído e pendente') + ' · ' + (EN ? 'Digital projects' : 'Projectos digitais');
  var TA = D.tarefas || [];
  var feitos = TA.filter(function (r) { return r.estado === 'concluido'; });
  // mais recentes primeiro; sem data no fim
  feitos.sort(function (a, b) { return (b.concl || '0') < (a.concl || '0') ? -1 : (b.concl || '0') > (a.concl || '0') ? 1 : 0; });
  var tot = TA.length, nf = feitos.length;
  var km = ((D.km30 || {}).passos || []).filter(function (x) { return x.estado === 'concluido'; });
  var V = D.vendas || { rotas: [], aVender: [] };
  var CK = '<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';
  var h = '';
  h += '<div class="top"><div class="brand"><img src="assets/naval-logo.png" alt="Naval"><div><div class="eyebrow">' + (EN ? 'Digital projects · IT · Summary' : 'Projectos digitais · IT · Resumo') + '</div><h1>' + (EN ? 'Done and pending' : 'Concluído e pendente') + '</h1></div></div>';
  h += '<div class="meta"><span class="badge">' + (EN ? 'As of ' : 'Actualizado a ') + dt(D.actualizado, true) + '</span><div class="lang"><a href="?lang=pt" data-l="pt"' + (EN ? '' : ' class="on"') + '>PT</a><a href="?lang=en" data-l="en"' + (EN ? ' class="on"' : '') + '>EN</a></div></div></div>';
  h += '<div class="kpis">' +
    '<div class="card kpi"><span class="v">' + nf + '<span style="font-size:28px;color:var(--mut)"> / ' + tot + '</span></span><div><div class="l">' + (EN ? 'Topics completed' : 'Temas concluídos') + '</div><div class="n">' + (tot - nf) + (EN ? ' still in progress or pending' : ' ainda em curso ou pendentes') + '</div></div></div>' +
    '<div class="card kpi"><span class="v">' + V.aVender.length + '<span style="font-size:28px;color:var(--mut)"> / ' + V.rotas.length + '</span></span><div><div class="l">' + (EN ? 'RTM routes selling' : 'Rotas RTM a vender') + '</div><div class="n">' + esc(L(V.docs)) + '</div></div></div>' +
    '<div class="card kpi"><span class="v">' + km.length + '<span style="font-size:28px;color:var(--mut)"> / ' + ((D.km30 || {}).passos || []).length + '</span></span><div><div class="l">' + (EN ? 'KM30 steps done' : 'Passos do KM30 concluídos') + '</div><div class="n">' + esc(L((D.km30 || {}).bloqueio)) + '</div></div></div></div>';
  var EST = EN ? { definido: 'Defined', curso: 'In progress', previsto: 'Planned', aguarda: 'Awaiting approval', bloqueado: 'Blocked' } : { definido: 'Definido', curso: 'Em curso', previsto: 'Previsto', aguarda: 'Aguarda aprovação', bloqueado: 'Bloqueado' };
  var COR = { definido: ['rgba(124,198,238,0.16)', '#7CC6EE', '#7CC6EE'], curso: ['rgba(35,151,212,0.22)', '#5FB8E8', '#2397D4'], previsto: ['rgba(255,255,255,0.08)', 'rgba(235,235,245,0.75)', '#2397D4'], aguarda: ['rgba(201,130,42,0.18)', '#E0A458', '#C9822A'], bloqueado: ['rgba(255,105,97,0.16)', '#FF8A84', '#FF6961'] };
  var ORD = { bloqueado: 0, aguarda: 1, curso: 2, definido: 3, previsto: 4 };
  var pend = TA.filter(function (r) { return r.estado !== 'concluido'; }).sort(function (a, b) { return (ORD[a.estado] - ORD[b.estado]) || ((b.pct || 0) - (a.pct || 0)); });
  var tag = function (pj) { return '<span class="tag" style="color:' + (pj === 'RTM' ? '#7CC6EE' : '#B5A8F0') + '">' + pj + '</span>'; };
  h += '<div class="cols">';
  h += '<div class="card col"><div class="ch"><h2 style="color:var(--okt)">' + (EN ? 'Done' : 'Concluído') + '</h2><span>' + nf + (EN ? ' topics' : ' temas') + '</span></div>';
  feitos.forEach(function (r) {
    h += '<div class="it">' + CK + '<div><div class="t">' + tag(r.proj) + esc(EN ? r.en : r.pt) + '</div>' + (r.det ? '<div class="d">' + esc(L(r.det)) + '</div>' : '') + '</div><div class="dt">' + (r.concl ? dt(r.concl) : '') + '</div></div>';
  });
  h += '</div>';
  h += '<div class="card col"><div class="ch"><h2 style="color:#5FB8E8">' + (EN ? 'Pending' : 'Pendente') + '</h2><span>' + pend.length + (EN ? ' topics · blocked first' : ' temas · bloqueados primeiro') + '</span></div>';
  pend.forEach(function (r) {
    var c = COR[r.estado] || COR.previsto, prev = r.prev == null ? (EN ? 'TBC' : 'A definir') : (typeof r.prev === 'string' ? dt(r.prev) : L(r.prev));
    var ex = r.pct != null ? '<span class="bar"><i style="width:' + r.pct + '%;background:' + c[2] + '"></i></span><span class="pc" style="color:' + c[1] + '">' + r.pct + '%</span>' : '<span class="pc" style="color:#7CC6EE;text-align:left">' + esc(L(r.valor)) + '</span>';
    h += '<div class="pd"><div><div class="t">' + tag(r.proj) + esc(EN ? r.en : r.pt) + '</div>' + (r.det ? '<div class="d">' + esc(L(r.det)) + '</div>' : '') + '</div><span class="pill" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(EST[r.estado] || r.estado) + '</span><span class="ex">' + ex + '</span><span class="pv" style="color:' + (r.prev == null ? 'rgba(235,235,245,0.45)' : 'rgba(235,235,245,0.85)') + '">' + esc(prev) + '</span></div>';
  });
  h += '</div></div>';
  h += '<div class="foot"><span>Grupo Naval Angola · ' + (EN ? 'Digital Projects' : 'Projectos Digitais') + '</span><span><a href="ponto-situacao.html?lang=' + (EN ? 'en' : 'pt') + '">' + (EN ? 'Full status update →' : 'Ponto de situação completo →') + '</a></span></div>';
  var st = document.getElementById('stage'); st.innerHTML = h;
  st.querySelectorAll('.lang a').forEach(function (a) { a.addEventListener('click', function () { try { localStorage.setItem('naval-lang', a.getAttribute('data-l')); } catch (e) {} }); });
  if (window.self !== window.top) document.body.classList.add('embed');
  function fit() {
    var w = window.innerWidth, hh = window.innerHeight;
    if (w < 900 || w / hh < 1.1) { document.body.classList.add('flow'); st.style.transform = ''; return; }
    document.body.classList.remove('flow');
    st.style.transform = 'scale(' + Math.min(w / 1920, hh / 1080) + ')';
  }
  window.addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #7CC6EE; letter-spacing: 1px">HUMAN RESOURCES · MANAGERS & HR</span>
<span class="fase2" title="Phase 2" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; padding: 4px 10px; border-radius: 99px; background: rgba(201,130,42,0.16); color: #E0A458; border: 1px solid rgba(201,130,42,0.35)">Phase 2 · process prototype, does not post to the ERP yet</span>
<h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.5px">People management</h1>
<span style="font-size: 13px; color: rgba(235,235,245,0.6)">Managers see only their team; Human Resources see all 23 companies · <span style="color: #C9822A">sample data</span></span>
</div>
<div role="tablist" aria-label="View" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; background: rgba(255,255,255,0.05)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}<span style="{{t.badgeStyle}}">{{t.badge}}</span></button>
</sc-for>
</div>
</header>
<section aria-label="Indicators" class="g4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.10)">
<span style="font-size: 11px; color: rgba(235,235,245,0.6); letter-spacing: 1px; text-transform: uppercase">{{k.label}}</span>
<span style="font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums">{{k.value}}</span>
<span style="{{k.noteStyle}}">{{k.note}}</span>
</div>
</sc-for>
</section>
<sc-if value="{{vDir}}" hint-placeholder-val="{{ true }}">
<section aria-label="Directory" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Directory</h2>
<input type="search" value="{{busca}}" onInput="{{setBusca}}" placeholder="Search by name, role or company" aria-label="Search" style="flex: 0 1 320px; height: 38px; border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 0 12px; font-family: inherit; font-size: 14px; background: rgba(255,255,255,0.05); color: #F5F5F7">
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px">
<sc-for list="{{pessoas}}" as="p" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07)">
<span style="{{p.avatar}}">{{p.ini}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto"><span style="font-size: 14px; font-weight: 500">{{p.nome}}</span><span style="font-size: 12px; color: rgba(235,235,245,0.6)">{{p.cargo}}</span><span style="font-size: 11px; color: rgba(235,235,245,0.45)">{{p.emp}}</span></span>
<span style="{{p.estStyle}}">{{p.estado}}</span>
</div>
</sc-for>
</div>
<span style="font-size: 12px; color: rgba(235,235,245,0.55)">{{dirNota}}</span>
</section>
</sc-if>
<sc-if value="{{vOrg}}" hint-placeholder-val="{{ false }}">
<section aria-label="Org chart" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); padding: 20px; display: flex; flex-direction: column; gap: 18px; align-items: center">
<h2 style="align-self: flex-start; margin: 0; font-size: 17px; font-weight: 600">Org chart · OCEANO · sales</h2>
<div style="{{org.raiz}}"><span style="font-size: 14px; font-weight: 600">[SALES DIRECTOR]</span><span style="font-size: 12px; color: rgba(235,235,245,0.6)">Sales director</span></div>
<span style="width: 2px; height: 22px; background: rgba(124,198,238,0.5); margin: -18px 0"></span>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; padding-top: 14px; border-top: 2px solid rgba(124,198,238,0.35)">
<sc-for list="{{org.chefias}}" as="c" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="{{c.box}}"><span style="font-size: 13px; font-weight: 600">{{c.nome}}</span><span style="font-size: 11px; color: rgba(235,235,245,0.6)">{{c.cargo}}</span><span style="font-size: 11px; color: #7CC6EE">{{c.equipa}}</span></div>
<div style="display: flex; gap: 4px">
<sc-for list="{{c.membros}}" as="m" hint-placeholder-count="4">
<span title="{{m.nome}}" style="{{m.avatar}}">{{m.ini}}</span>
</sc-for>
</div>
</div>
</sc-for>
</div>

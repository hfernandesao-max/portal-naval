<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { pincel: 'M', pub: false, grelha: [
['M', 'M', 'T', 'T', 'F', 'F', 'M'],
['T', 'T', 'F', 'F', 'M', 'M', 'T'],
['N', 'N', 'N', 'F', 'F', 'N', 'N'],
['M', 'M', 'M', 'M', 'M', 'F', 'F'],
['A', 'A', 'A', 'A', 'A', 'F', 'F'],
['T', 'T', 'T', 'F', 'T', 'T', 'F'],
['F', 'N', 'M', 'N', 'N', 'F', 'F'],
['B', 'B', 'B', 'T', 'T', 'M', 'F']
] };
}
renderVals() {
var self = this;
var S = { M: ['Manhã', '07–15', 8, '#2397D4'], T: ['Tarde', '15–23', 8, '#7B87E0'], N: ['Noite', '23–07', 8, '#4A5BB0'], F: ['Folga', '', 0, ''], A: ['Férias', '', 0, '#C9822A'], B: ['Baixa', '', 0, '#FF6961'] };
var P = [['[COLABORADOR A]', 'Chefe de turno', 40], ['[COLABORADOR B]', 'Fiel de armazém', 40], ['[COLABORADOR C]', 'Operador de empilhador', 40], ['[COLABORADOR D]', 'Fiel de armazém', 40], ['[COLABORADOR E]', 'Repositor', 40], ['[COLABORADOR F]', 'Repositor', 40], ['[COLABORADOR G]', 'Operador de empilhador', 40], ['[COLABORADOR H]', 'Conferente', 40]];
var D = ['Seg 19', 'Ter 20', 'Qua 21', 'Qui 22', 'Sex 23', 'Sáb 24', 'Dom 25'];
var g = this.state.grelha;
var pin = this.state.pincel;
var set = function (i, j) {
var x = g[i][j]; if (x === 'A' || x === 'B') return;
var n = g.map(function (r) { return r.slice(); });
n[i][j] = (x === pin) ? 'F' : pin;
self.setState({ grelha: n, pub: false });
};
var conf = [];
var linhas = P.map(function (p, i) {
var h = 0;
var cel = g[i].map(function (x, j) {
var s = S[x]; h += s[2];
var lock = x === 'A' || x === 'B';
var bad = j > 0 && g[i][j - 1] === 'N' && (x === 'M');
if (bad) conf.push(['Descanso inferior a 11 h', p[0] + ' · noite de ' + D[j - 1] + ' seguida de manhã de ' + D[j], 'r']);
var bg = x === 'F' ? 'rgba(255,255,255,0.04)' : s[3];
return { sig: x === 'F' ? '—' : s[0], hora: s[1], tip: p[0] + ' · ' + D[j] + ' · ' + s[0] + (lock ? ' (do módulo de ausências)' : ''), pick: function () { set(i, j); },
style: 'height: 44px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: inherit; cursor: ' + (lock ? 'not-allowed' : 'pointer') + '; color: ' + (x === 'F' ? 'rgba(235,235,245,0.45)' : '#FFFFFF') + '; border: ' + (bad ? '2px solid #FF6961' : '1px solid rgba(255,255,255,0.08)') + '; background: ' + (lock ? 'repeating-linear-gradient(135deg, ' + bg + ' 0 6px, rgba(0,0,0,0.25) 6px 12px)' : bg) + (x === 'F' ? '' : '; box-shadow: 0 0 10px ' + bg + '55') };
});
var seg = 0, mx = 0; g[i].forEach(function (x) { if (x === 'M' || x === 'T' || x === 'N') { seg++; mx = Math.max(mx, seg); } else seg = 0; });
if (mx > 6) conf.push(['Mais de 6 dias seguidos', p[0] + ' · ' + mx + ' dias sem folga', 'r']);
var ex = h - p[2];
if (ex > 0) conf.push(['Horas extra', p[0] + ' · ' + ex + ' h acima do contrato · seguem para aprovação', 'a']);
return { nome: p[0], cargo: p[1], celulas: cel, horas: h + ' h', horasStyle: 'text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: ' + (ex > 0 ? '#E0A458' : (h < p[2] - 8 ? 'rgba(235,235,245,0.55)' : '#F5F5F7')) };
});
var falta = 0;
var cobertura = D.map(function (d, j) {
var c = { M: 0, T: 0, N: 0 }; g.forEach(function (r) { if (c[r[j]] != null) c[r[j]]++; });
var st = function (v, m) { if (v < m) falta++; return 'padding: 1px 6px; border-radius: 6px; ' + (v < m ? 'background: rgba(255,69,58,0.16); color: #FF6961' : 'color: rgba(235,235,245,0.75)'); };
var o = { m: c.M + '/2', t: c.T + '/2', n: c.N + '/1', mS: st(c.M, 2), tS: st(c.T, 2), nS: st(c.N, 1) };
if (c.M < 2 || c.T < 2 || c.N < 1) conf.push(['Cobertura abaixo do mínimo', d + ' · ' + (c.M < 2 ? 'manhã ' : '') + (c.T < 2 ? 'tarde ' : '') + (c.N < 1 ? 'noite' : ''), 'a']);
return o;
});
var tot = 0, ext = 0; linhas.forEach(function (l, i) { var h = parseInt(l.horas, 10); tot += h; ext += Math.max(0, h - P[i][2]); });
var nota = 'font-size: 12px; color: ';
var nConf = conf.filter(function (c) { return c[2] === 'r'; }).length;
var kpis = [
{ label: 'Horas planeadas', value: tot + ' h', note: 'de ' + (P.length * 40) + ' h contratadas', noteStyle: nota + 'rgba(235,235,245,0.6)' },
{ label: 'Cobertura', value: Math.round((21 - falta) / 21 * 100) + '%', note: falta ? falta + ' turnos abaixo do mínimo' : 'todos os turnos cobertos', noteStyle: nota + (falta ? '#E0A458' : '#30D158') },
{ label: 'Conflitos', value: String(nConf), note: nConf ? 'resolver antes de publicar' : 'nenhum conflito', noteStyle: nota + (nConf ? '#FF6961' : '#30D158') },
{ label: 'Horas extra previstas', value: ext + ' h', note: 'seguem para a chefia aprovar', noteStyle: nota + (ext ? '#E0A458' : 'rgba(235,235,245,0.6)') }
];
var pinceis = ['M', 'T', 'N', 'F'].map(function (k) {
